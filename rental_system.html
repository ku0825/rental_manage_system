// LEASE FILE MANAGEMENT
// ============================================================
const LEASE_MAX_ACTIVE = 6;
const LEASE_STORAGE_WARN_MB = 4; // warn when total files exceed 4 MB

function leaseTotalBytes() {
  return state.properties.reduce((s, p) => {
    return s + (p.leaseFiles||[]).reduce((ss, f) => ss + (f.data ? f.data.length * 0.75 : 0), 0);
  }, 0);
}

function leaseFileIcon(type) {
  if (!type) return '📄';
  if (type.includes('pdf')) return '📕';
  if (type.includes('image')) return '🖼';
  if (type.includes('word') || type.includes('document')) return '📘';
  return '📄';
}

function fmtBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(0) + ' KB';
  return (b/1048576).toFixed(1) + ' MB';
}

function renderLeaseSection(p) {
  const files    = p.leaseFiles  || [];
  const drafts   = p.leaseDrafts || [];
  const active   = files.filter(f => f.status === 'active');
  const archived = files.filter(f => f.status === 'archived');
  const hasWarn  = leaseTotalBytes() > LEASE_STORAGE_WARN_MB * 1048576;
  const open     = !!_sectionOpen[p.id+'_lease'];
  const summary  = `新租約 ${active.length}/${LEASE_MAX_ACTIVE}${archived.length?' · 舊租約 '+archived.length:''}${drafts.length?' · 草稿 '+drafts.length:''}`;
  return `
  <div class="lease-section no-print">
    <div class="prop-sec-hdr" onclick="togglePropSection('${p.id}','lease')">
      <div class="prop-sec-title">📄 租約文件 · ${summary}${hasWarn?' <span style="color:#c0392b">⚠ 空間接近上限</span>':''}</div>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="btn-ghost btn-sm" type="button"
          onclick="event.stopPropagation();openLeaseModal('${p.id}')"
          style="font-size:11px;padding:3px 10px">管理文件</button>
        <span id="sec-arr-${p.id}-lease" style="font-size:11px;color:#aaa;min-width:10px">${open?'▲':'▼'}</span>
      </div>
    </div>
    <div id="sec-${p.id}-lease" style="${open?'':'display:none'}">
      <div class="lease-file-grid" style="padding-bottom:6px">
        ${active.map(f => `
          <div class="lease-file-card" onclick="openLeaseModal('${p.id}')"
            title="點擊管理：${f.name}（在文件管理中可預覽）" style="cursor:pointer">
            <div class="lease-file-icon">${leaseFileIcon(f.type)}</div>
            <div class="lease-file-name">${f.name}</div>
            <div class="lease-file-meta">${fmtBytes(Math.round((f.data||'').length*0.75))}</div>
            <div class="lease-file-status lfs-active">新租約</div>
          </div>`).join('')}
        ${active.length < LEASE_MAX_ACTIVE
          ? `<div class="lease-empty-slot" onclick="triggerLeaseUpload('${p.id}')" style="cursor:pointer" title="上傳租約文件"><span>＋ 上傳</span></div>`
          : ''}
        ${active.length === 0 && archived.length === 0
          ? '<div style="font-size:11px;color:#bbb;padding:4px 0">尚未上傳租約文件</div>' : ''}
      </div>
      <input type="file" id="lease-upload-${p.id}" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"
        multiple style="display:none" onchange="handleLeaseFileUpload('${p.id}',this)">
    </div>
  </div>`;
}

function triggerLeaseUpload(propId) {
  document.getElementById('lease-upload-' + propId)?.click();
}

async function handleLeaseFileUpload(propId, input) {
  const p = state.properties.find(x => x.id === propId);
  if (!p) return;
  p.leaseFiles = p.leaseFiles || [];
  const active = p.leaseFiles.filter(f => f.status === 'active');
  const remaining = LEASE_MAX_ACTIVE - active.length;
  const files = Array.from(input.files).slice(0, remaining);
  if (!files.length) { showToast('⚠️ 新租約已達上限（' + LEASE_MAX_ACTIVE + ' 個），請先歸檔舊文件'); return; }
  const uname = state.profile.username;
  showToast('⬆️ 上傳中…', 30000);
  for (const file of files) {
    const base64 = await new Promise((res, rej) => {
      const reader = new FileReader();
      reader.onload = e => res(e.target.result.split(',')[1]);
      reader.onerror = rej;
      reader.readAsDataURL(file);
    });
    const fileId = 'lf_' + Date.now() + Math.random().toString(36).slice(2,5);
    const _ref = `users/${_fbUid || uname}/lf/${fileId}`;
    let uploadedRef = null, downloadToken = null;
    try {
      const meta = await fsStorageUpload(_ref, base64, file.type);
      uploadedRef = _ref;
      downloadToken = (meta.downloadTokens || '').split(',')[0] || null;
    } catch(e) { console.warn('Storage upload failed', e); }
    p.leaseFiles.push({
      id: fileId, name: file.name, type: file.type, size: file.size,
      data: base64, storageRef: uploadedRef, downloadToken,
      uploadedAt: new Date().toISOString().slice(0,10),
      status: 'active', archivedAt: null, notes: '',
    });
  }
  renderView(); saveUserData();
  showToast('✅ 已上傳 ' + files.length + ' 個租約文件（含雲端備份）');
  if (document.getElementById('lease-modal').style.display !== 'none') openLeaseModal(propId);
  input.value = '';
}

async function downloadLeaseFile(propId, fileId) {
  const p = state.properties.find(x => x.id === propId);
  const f = (p?.leaseFiles||[]).find(x => x.id === fileId);
  if (!f) return;
  let data = f.data;
  if (!data && f.storageRef) {
    showToast('⬇️ 從雲端下載中…');
    try { data = await fsStorageDownload(f.storageRef, f.downloadToken); f.data = data; saveUserData(); }
    catch(e) { showToast('❌ 下載失敗：' + (e.message || '請確認網路連線')); return; }
  }
  if (!data) { showToast('❌ 找不到檔案（請在原電腦點「☁️ 同步到雲端」後再試）'); return; }
  const blob = b64toBlob(data, f.type || 'application/octet-stream');
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = f.name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function b64toBlob(b64, type) {
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
  return new Blob([buf], {type});
}

function archiveLeaseFiles(propId) {
  const p = state.properties.find(x => x.id === propId);
  if (!p) return;
  const active = (p.leaseFiles||[]).filter(f => f.status === 'active');
  if (!active.length) { showToast('⚠️ 目前沒有新租約文件可歸檔'); return; }
  if (!confirm('確定將「' + p.name + '」的 ' + active.length + ' 個新租約文件全部歸檔（移至舊租約）？')) return;
  const now = new Date().toISOString().slice(0,10);
  active.forEach(f => { f.status = 'archived'; f.archivedAt = now; if(!f.notes) f.notes=''; });
  renderView(); saveUserData(); openLeaseModal(propId);
  showToast('✅ 已歸檔 ' + active.length + ' 個文件');
}

function deleteLeaseFile(propId, fileId) {
  const p = state.properties.find(x => x.id === propId);
  if (!p) return;
  const f = (p.leaseFiles||[]).find(x => x.id === fileId);
  if (!f || !confirm('確定刪除文件「' + f.name + '」？此操作無法復原。')) return;
  if (f.storageRef) fsStorageDelete(f.storageRef); // also remove from cloud
  p.leaseFiles = p.leaseFiles.filter(x => x.id !== fileId);
  renderView(); saveUserData(); openLeaseModal(propId);
  showToast('🗑 已刪除文件');
}

function openLeaseModal(propId) {
  const p = state.properties.find(x => x.id === propId);
  if (!p) return;
  document.getElementById('lease-modal-title').textContent = '📄 租約文件管理：' + p.name;
  renderLeaseModalBody(propId);
  updateLeaseStorageInfo();
  document.getElementById('lease-modal').style.display = 'flex';
  // Show sync button only when there are files missing storageRef but with local data
  _updateSyncBtn();
}

function _updateSyncBtn() {
  const btn = document.getElementById('lease-sync-btn');
  if (!btn) return;
  const needSync = state.properties.some(p =>
    [...(p.leaseFiles||[]), ...(p.leaseDrafts||[])].some(f => f.data && !f.storageRef)
  );
  btn.style.display = needSync ? '' : 'none';
}

// Upload all local files that lack storageRef to Firebase Storage
async function syncLeaseFilesToStorage() {
  const uname = state.profile.username;
  const btn = document.getElementById('lease-sync-btn');
  if (btn) { btn.disabled = true; btn.textContent = '☁️ 同步中…'; }

  let total = 0, done = 0, failed = 0;
  for (const p of state.properties) {
    for (const f of (p.leaseFiles || [])) {
      if (f.data && !f.storageRef) total++;
    }
    for (const f of (p.leaseDrafts || [])) {
      if (f.data && !f.storageRef) total++;
    }
  }
  if (!total) { showToast('✅ 所有文件已在雲端，無需同步'); if (btn) { btn.disabled = false; btn.textContent = '☁️ 同步到雲端'; } return; }

  for (const p of state.properties) {
    for (const f of (p.leaseFiles || [])) {
      if (!f.data || f.storageRef) continue;
      const ref = `users/${_fbUid || uname}/lf/${f.id}`;
      try {
        const meta = await fsStorageUpload(ref, f.data, f.type);
        f.storageRef = ref;
        f.downloadToken = (meta.downloadTokens || '').split(',')[0] || null;
        done++;
      } catch(e) { failed++; }
      if (btn) btn.textContent = `☁️ 同步中 ${done+failed}/${total}`;
    }
    for (const f of (p.leaseDrafts || [])) {
      if (!f.data || f.storageRef) continue;
      const ref = `users/${_fbUid || uname}/ld/${f.id}`;
      try {
        const meta = await fsStorageUpload(ref, f.data, f.type);
        f.storageRef = ref;
        f.downloadToken = (meta.downloadTokens || '').split(',')[0] || null;
        done++;
      } catch(e) { failed++; }
      if (btn) btn.textContent = `☁️ 同步中 ${done+failed}/${total}`;
    }
  }

  saveUserData();
  _updateSyncBtn();
  if (btn) { btn.disabled = false; btn.textContent = '☁️ 同步到雲端'; }
  if (failed) showToast(`⚠️ 完成：${done} 個成功，${failed} 個失敗`);
  else showToast(`✅ 已同步 ${done} 個文件到雲端，其他裝置現在可以下載`);
}

  <div id="lease-prev-pane" class="lease-prev-pane">
    <div style="text-align:center;color:#bbb;padding:20px">
      <div style="font-size:36px;margin-bottom:10px">👆</div>
      <div style="font-size:12px;line-height:1.6">點擊左側文件<br>的「👁 預覽」按鈕<br>即可在此預覽</div>
    </div>
  </div>
</div>`;
}

function switchLeaseTab(propId, tab) {
  ['active','archived','draft'].forEach(t => {
    const btn   = document.getElementById('ltab-' + t);
    const panel = document.getElementById('ltab-panel-' + t);
    if (btn)   { btn.className   = t===tab ? 'btn-pri btn-sm'   : 'btn-ghost btn-sm'; btn.style.fontSize='12px'; }
    if (panel) panel.style.display = t===tab ? '' : 'none';
  });
}

async function handleLeaseDraftUpload(propId, input) {
  const p = state.properties.find(x => x.id === propId);
  if (!p) return;
  p.leaseDrafts = p.leaseDrafts || [];
  const files = Array.from(input.files);
  const uname = state.profile.username;
  showToast('⬆️ 上傳中…', 30000);
  for (const file of files) {
    const base64 = await new Promise((res, rej) => {
      const reader = new FileReader();
      reader.onload = e => res(e.target.result.split(',')[1]);
      reader.onerror = rej;
      reader.readAsDataURL(file);
    });
    const fileId = 'ld_' + Date.now() + Math.random().toString(36).slice(2,5);
    const storageRef = `users/${uname}/ld/${fileId}`;
    try { await fsStorageUpload(storageRef, base64, file.type); } catch(e) { console.warn('Storage upload failed', e); }
    p.leaseDrafts.push({
      id: fileId, name: file.name, type: file.type, size: file.size,
      data: base64, storageRef,
      createdAt: new Date().toISOString().slice(0,10),
    });
  }
  renderView(); saveUserData(); renderLeaseModalBody(propId);
  switchLeaseTab(propId, 'draft');
  showToast('✅ 已上傳 ' + files.length + ' 個草稿（含雲端備份）');
  input.value = '';
}

async function downloadLeaseDraft(propId, fileId) {
  const p = state.properties.find(x => x.id === propId);
  const f = (p?.leaseDrafts||[]).find(x => x.id === fileId);
  if (!f) return;
  let data = f.data;
  if (!data && f.storageRef) {
    showToast('⬇️ 從雲端下載中…');
    try { data = await fsStorageDownload(f.storageRef, f.downloadToken); f.data = data; saveUserData(); }
    catch(e) { showToast('❌ 下載失敗：' + (e.message || '請確認網路連線')); return; }
  }
  if (!data) { showToast('❌ 找不到檔案（請在原電腦點「☁️ 同步到雲端」後再試）'); return; }
  const blob = b64toBlob(data, f.type || 'application/octet-stream');
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = f.name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function deleteLeaseDraft(propId, fileId) {
  const p = state.properties.find(x => x.id === propId);
  if (!p) return;
  const f = (p.leaseDrafts||[]).find(x => x.id === fileId);
  if (!f || !confirm('確定刪除草稿「' + f.name + '」？')) return;
  if (f.storageRef) fsStorageDelete(f.storageRef);
  p.leaseDrafts = p.leaseDrafts.filter(x => x.id !== fileId);
  renderView(); saveUserData(); renderLeaseModalBody(propId);
  switchLeaseTab(propId, 'draft');
  showToast('🗑 草稿已刪除');
}

async function promoteDraftToActive(propId, fileId) {
  const p = state.properties.find(x => x.id === propId);
  if (!p) return;
  const f = (p.leaseDrafts||[]).find(x => x.id === fileId);
  if (!f) return;
  const active = (p.leaseFiles||[]).filter(x => x.status === 'active');
  if (active.length >= LEASE_MAX_ACTIVE) { showToast('⚠️ 新租約已達上限，請先歸檔舊文件'); return; }
  p.leaseFiles = p.leaseFiles || [];
  const newId = 'lf_' + Date.now() + Math.random().toString(36).slice(2,5);
  const uname = state.profile.username;
  const newStorageRef = `users/${uname}/lf/${newId}`;
  let data = f.data;
  if (!data && f.storageRef) {
    try { data = await fsStorageDownload(f.storageRef); } catch(e) {}
  }
  if (data) {
    try { await fsStorageUpload(newStorageRef, data, f.type); } catch(e) {}
    if (f.storageRef) fsStorageDelete(f.storageRef);
  }
  p.leaseFiles.push({
    id: newId, name: f.name, type: f.type, size: f.size,
    data, storageRef: newStorageRef,
    uploadedAt: new Date().toISOString().slice(0,10),
    status: 'active', archivedAt: null, notes: '',
  });
  p.leaseDrafts = p.leaseDrafts.filter(x => x.id !== fileId);
  renderView(); saveUserData(); renderLeaseModalBody(propId);
  switchLeaseTab(propId, 'active');
  showToast('✅ 草稿已升級為正式租約');
}

function saveLeaseFileNote(propId, fileId, val) {
  const p = state.properties.find(x => x.id === propId);
  if (!p) return;
  const f = (p.leaseFiles||[]).find(x => x.id === fileId);
  if (!f) return;
  f.notes = val;
  saveUserData();
}

function handleLeaseArchivedUpload(propId, input) {
  const p = state.properties.find(x => x.id === propId);
  if (!p) return;
  p.leaseFiles = p.leaseFiles || [];
  const files = Array.from(input.files);
  let loaded = 0;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      const base64 = e.target.result.split(',')[1];
      const now = new Date().toISOString().slice(0,10);
      p.leaseFiles.push({
        id: 'lf_' + Date.now() + Math.random().toString(36).slice(2,5),
        name: file.name, type: file.type, size: file.size,
        data: base64,
        uploadedAt: now,
        status: 'archived',
        archivedAt: now,
        notes: '',
      });
      loaded++;
      if (loaded === files.length) {
        renderView(); saveUserData(); renderLeaseModalBody(propId);
        switchLeaseTab(propId, 'archived');
        showToast('✅ 已上傳 ' + loaded + ' 個舊租約文件');
      }
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}

function updateLeaseStorageInfo() {
  const total = leaseTotalBytes();
  const mb = (total/1048576).toFixed(1);
  const pct = Math.min(100, (total/(10*1048576))*100).toFixed(0);
  const color = total > LEASE_STORAGE_WARN_MB*1048576 ? '#c0392b' : '#1e8449';
  const el = document.getElementById('lease-storage-info');
  if (el) el.innerHTML = `文件佔用：<strong style="color:${color}">${mb} MB</strong> / 約 10 MB 上限
    <div class="lease-storage-bar" style="width:120px;display:inline-block;vertical-align:middle;margin-left:8px">
      <div class="lease-storage-fill" style="width:${pct}%;background:${color}"></div>
    </div>`;
}

function togglePropSection(propId, kind) {
  const key = propId + '_' + kind;
  _sectionOpen[key] = !_sectionOpen[key];
  const body  = document.getElementById('sec-' + propId + '-' + kind);
  const arrow = document.getElementById('sec-arr-' + propId + '-' + kind);
  if (body)  body.style.display  = _sectionOpen[key] ? '' : 'none';
  if (arrow) arrow.textContent   = _sectionOpen[key] ? '▲' : '▼';
}

function previewLeaseFile(propId, fileId, kind) {
  if (_leasePreviewUrl) { URL.revokeObjectURL(_leasePreviewUrl); _leasePreviewUrl = null; }
  const p = state.properties.find(x => x.id === propId);
  const arr = kind === 'draft' ? (p?.leaseDrafts||[]) : (p?.leaseFiles||[]);
  const f = arr.find(x => x.id === fileId);
  if (!f) return;
  const pane = document.getElementById('lease-prev-pane');
  if (!pane) return;

  const isImg = f.type && f.type.startsWith('image/');
  const isPdf = f.type === 'application/pdf';
  const _fname = (f.name||'').toLowerCase();
  const isDocx = f.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
               || _fname.endsWith('.docx');
  const isDocOld = f.type === 'application/msword' || (_fname.endsWith('.doc') && !_fname.endsWith('.docx'));
  const dlFn = kind==='draft' ? `downloadLeaseDraft('${propId}','${f.id}')` : `downloadLeaseFile('${propId}','${f.id}')`;

  if (isPdf || isImg) {
    const blob = b64toBlob(f.data, f.type || 'application/octet-stream');
    _leasePreviewUrl = URL.createObjectURL(blob);
    if (isPdf) {
      pane.innerHTML = `<iframe src="${_leasePreviewUrl}" style="width:100%;height:100%;min-height:520px;border:none"></iframe>`;
    } else {
      pane.innerHTML = `<img src="${_leasePreviewUrl}" style="max-width:100%;max-height:580px;object-fit:contain;padding:10px">`;
    }
  } else if (isDocx) {
    pane.innerHTML = `<div style="padding:20px;width:100%;text-align:center;color:#888;font-size:13px">⏳ Word 文件轉換中…</div>`;
    // Load mammoth.js on demand, then convert
    function doMammoth() {
      // base64 → ArrayBuffer
      const bin = atob(f.data);
      const buf = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      mammoth.convertToHtml({ arrayBuffer: buf.buffer })
        .then(result => {
          pane.innerHTML = `
            <div style="width:100%;height:100%;overflow:auto;padding:16px 20px;text-align:left;font-size:13px;line-height:1.7;color:#333">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #e5e7eb">
                <span style="font-size:12px;color:#888">📄 ${f.name}</span>
                <button class="btn-ghost btn-sm" onclick="${dlFn}" style="font-size:11px">⬇ 下載原檔</button>
              </div>
              ${result.value || '<span style="color:#aaa">（文件內容為空）</span>'}
              ${result.messages.length ? `<div style="margin-top:12px;font-size:10px;color:#aaa">⚠️ ${result.messages.length} 個轉換警告（部分格式可能有差異）</div>` : ''}
            </div>`;
        })
        .catch(err => {
          pane.innerHTML = `<div style="text-align:center;padding:30px 16px;color:#888">
            <div style="font-size:36px;margin-bottom:10px">⚠️</div>
            <div style="font-size:13px;color:#555;margin-bottom:10px">Word 轉換失敗</div>
            <div style="font-size:11px;color:#aaa;margin-bottom:14px">${err.message||''}</div>
            <button class="btn-ghost btn-sm" onclick="${dlFn}">⬇ 下載開啟</button>
          </div>`;
        });
    }
    if (typeof mammoth !== 'undefined') {
      doMammoth();
    } else {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
      s.onload = doMammoth;
      s.onerror = () => {
        pane.innerHTML = `<div style="text-align:center;padding:30px 16px;color:#888">
          <div style="font-size:36px;margin-bottom:10px">📝</div>
          <div style="font-size:13px;color:#555;margin-bottom:5px">${f.name}</div>
          <div style="font-size:11px;color:#aaa;margin-bottom:14px">無法載入轉換器，請直接下載開啟</div>
          <button class="btn-ghost btn-sm" onclick="${dlFn}">⬇ 下載開啟</button>
        </div>`;
      };
      document.head.appendChild(s);
    }
  } else if (isDocOld) {
    pane.innerHTML = `<div style="text-align:center;padding:30px 20px;color:#888">
      <div style="font-size:48px;margin-bottom:12px">📄</div>
      <div style="font-size:13px;font-weight:600;color:#444;margin-bottom:6px">${f.name}</div>
      <div style="font-size:12px;color:#e07a00;background:#fff8ed;border:1px solid #f0d0a0;border-radius:8px;padding:10px 14px;margin:10px 0;line-height:1.6">
        ⚠️ 舊版 <strong>.doc</strong> 格式不支援瀏覽器預覽。<br>
        請用 Word 開啟後「另存新檔」為 <strong>.docx</strong>，<br>再重新上傳即可預覽。
      </div>
      <button class="btn-ghost btn-sm" onclick="${dlFn}" style="margin-top:6px">⬇ 下載開啟</button>
    </div>`;
  } else {
    pane.innerHTML = `<div style="text-align:center;padding:30px 16px;color:#888">
      <div style="font-size:48px;margin-bottom:10px">${leaseFileIcon(f.type)}</div>
      <div style="font-size:13px;font-weight:600;color:#555;margin-bottom:5px">${f.name}</div>
      <div style="font-size:11px;color:#aaa;margin-bottom:14px">此格式不支援預覽</div>
      <button class="btn-ghost btn-sm" onclick="${dlFn}">⬇ 下載開啟</button>
    </div>`;
  }
}

// RENT HISTORY MODAL
// ============================================================
function openRentHistModal(propId) {
  _rentHistPropId = propId || null;
  const modal = document.getElementById('rent-hist-modal');
  if (!modal) return;
  modal.style.display = 'flex';
  renderRentHistBody(_rentHistPropId);
}

function closeRentHistModal() {
  const modal = document.getElementById('rent-hist-modal');
  if (modal) modal.style.display = 'none';
  _rentHistPropId = null;
  _editingRentHistory = [];
}

function renderRentHistBody(propId) {
  const body = document.getElementById('rent-hist-body');
  const title = document.getElementById('rent-hist-title');
  const saveBtn = document.getElementById('rent-hist-save-btn');
  if (!body) return;

  if (!propId) {
    // All-properties summary view
    if (title) title.textContent = '🏘 全部房產租金記錄總覽';
    if (saveBtn) saveBtn.style.display = 'none';
    renderAllRentSummary();
    return;
  }

  const p = state.properties.find(x => x.id === propId);
  if (!p) { body.innerHTML = '<p>找不到房產。</p>'; return; }
  if (title) title.textContent = '📊 租金記錄 — ' + p.name;
  if (saveBtn) saveBtn.style.display = '';

  // Init editing copy from property
  _editingRentHistory = JSON.parse(JSON.stringify(p.rentHistory || []));
  renderRentHistUI(p);
}

function renderRentHistUI(p) {
  const body = document.getElementById('rent-hist-body');
  if (!body) return;
  const pid = p ? p.id : (_rentHistPropId);
  const prop = p || state.properties.find(x => x.id === pid);
  if (!prop) return;

  // Build combined timeline: rentHistory + rentTiers (for reference)
  const today = new Date().toISOString().slice(0,10);
  const fmt = n => Number(n||0).toLocaleString('zh-TW');

  // Sort _editingRentHistory by from date
  const sorted = [..._editingRentHistory].sort((a,b) => (a.from||'').localeCompare(b.from||''));

  // Rent tiers reference
  const tiersRef = prop.rentTiers && prop.rentTiers.length ? `
    <div style="background:#f0f4f0;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:12px">
      <div style="font-weight:600;margin-bottom:6px;color:#1b3a6e">📋 目前合約階段租金（參考）</div>
      ${prop.rentTiers.length === 0 ? '<span style="color:#888">無階段設定</span>' :
        prop.rentTiers.map(t => {
          const active = t.from && t.from <= today && (!t.to || today <= t.to);
          return `<div style="padding:3px 0;${active?'color:#1e8449;font-weight:600':''}">
            ${t.from||'?'} ~ ${t.to||'至今'}：$${fmt(t.rent)}/月${t.notes?' <span style="color:#888">（'+t.notes+'）</span>':''}${active?' ← 目前生效':''}
          </div>`;
        }).join('')}
    </div>` : '';

  // Current base rent reference
  const baseRef = `<div style="font-size:12px;color:#555;margin-bottom:12px">
    基本月租金：<strong>$${fmt(prop.rent)}</strong>
    ${prop.leaseStart||prop.leaseEnd ? `　合約期間：${prop.leaseStart||'?'} ~ ${prop.leaseEnd||'?'}` : ''}
  </div>`;

  // Editable history rows
  const rows = sorted.length === 0
    ? `<div style="color:#aaa;text-align:center;padding:20px 0;font-size:13px">尚無歷史租金記錄，請點「＋ 新增記錄」</div>`
    : sorted.map((row, i) => {
        const origIdx = _editingRentHistory.indexOf(_editingRentHistory.find(r => r.id === row.id));
        return `<div style="display:grid;grid-template-columns:110px 110px 100px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #f0f0f0">
          <div>
            <label style="font-size:10px;color:#888;display:block">起始</label>
            <input type="date" value="${row.from||''}" style="font-size:12px;width:100%;border:1px solid #ddd;border-radius:4px;padding:3px 5px"
              onchange="let r=_editingRentHistory.find(x=>x.id==='${row.id}');if(r){r.from=this.value;}">
          </div>
          <div>
            <label style="font-size:10px;color:#888;display:block">結束（可留空）</label>
            <input type="date" value="${row.to||''}" style="font-size:12px;width:100%;border:1px solid #ddd;border-radius:4px;padding:3px 5px"
              onchange="let r=_editingRentHistory.find(x=>x.id==='${row.id}');if(r){r.to=this.value;}">
          </div>
          <div>
            <label style="font-size:10px;color:#888;display:block">月租金</label>
            <div style="display:flex;align-items:center;gap:3px">
              <span style="color:#888;font-size:12px">$</span>
              <input type="number" value="${row.rent||0}" min="0" step="100" style="font-size:12px;width:80px;border:1px solid #ddd;border-radius:4px;padding:3px 5px"
                onchange="let r=_editingRentHistory.find(x=>x.id==='${row.id}');if(r){r.rent=parseFloat(this.value)||0;}">
            </div>
          </div>
          <div>
            <label style="font-size:10px;color:#888;display:block">備註</label>
            <input type="text" value="${(row.notes||'').replace(/"/g,'&quot;')}" placeholder="例：新租客、調漲、優惠期" style="font-size:12px;width:100%;border:1px solid #ddd;border-radius:4px;padding:3px 5px"
              onchange="let r=_editingRentHistory.find(x=>x.id==='${row.id}');if(r){r.notes=this.value;}">
          </div>
          <button type="button" style="background:none;border:none;color:#c0392b;cursor:pointer;font-size:16px;padding:4px" title="刪除此記錄"
            onclick="removeRentHistRow('${row.id}')">✕</button>
        </div>`;
      }).join('');

  body.innerHTML = `
    ${baseRef}
    ${tiersRef}
    <div style="font-weight:600;font-size:13px;margin-bottom:10px;color:#1b3a6e">📝 歷史租金記錄（可編輯）</div>
    <div id="rent-hist-rows">${rows}</div>
    <div style="margin-top:14px">
      <button type="button" class="btn-ghost btn-sm" onclick="addRentHistRow('${prop.id}')">＋ 新增記錄</button>
    </div>`;
}

function addRentHistRow(propId) {
  _editingRentHistory.push({
    id: 'rh_' + Date.now() + Math.random().toString(36).slice(2,5),
    from: '', to: '', rent: 0, notes: ''
  });
  const prop = state.properties.find(x => x.id === propId);
  renderRentHistUI(prop);
  // Show save button
  const saveBtn = document.getElementById('rent-hist-save-btn');
  if (saveBtn) saveBtn.style.display = '';
}

function removeRentHistRow(rowId) {
  const idx = _editingRentHistory.findIndex(r => r.id === rowId);
  if (idx !== -1) _editingRentHistory.splice(idx, 1);
  const prop = state.properties.find(x => x.id === _rentHistPropId);
  renderRentHistUI(prop);
}

function saveRentHistChanges() {
  const prop = state.properties.find(x => x.id === _rentHistPropId);
  if (!prop) return;
  prop.rentHistory = JSON.parse(JSON.stringify(_editingRentHistory));
  saveUserData();
  const saveBtn = document.getElementById('rent-hist-save-btn');
  if (saveBtn) saveBtn.style.display = 'none';
  showToast('✅ 租金記錄已儲存');
}

function renderAllRentSummary() {
  const body = document.getElementById('rent-hist-body');
  if (!body) return;
  const fmt = n => Number(n||0).toLocaleString('zh-TW');
  const today = new Date().toISOString().slice(0,10);

  if (!state.properties.length) {
    body.innerHTML = '<p style="color:#aaa;text-align:center;padding:30px 0">尚無房產資料。</p>';
    return;
  }

  const rows = state.properties.map(p => {
    // Collect all rent records: rentHistory + synthesize from rentTiers + current
    const records = [];

    // Add historical records
    (p.rentHistory || []).sort((a,b) => (a.from||'').localeCompare(b.from||'')).forEach(r => {
      records.push({ from: r.from, to: r.to, rent: r.rent, notes: r.notes, type: 'history' });
    });

    // Add rent tiers (if not already covered)
    if (p.rentTiers && p.rentTiers.length) {
      p.rentTiers.forEach(t => {
        records.push({ from: t.from, to: t.to, rent: t.rent, notes: t.notes || '（合約階段）', type: 'tier' });
      });
    } else if (!records.length || !records.some(r => !r.to || r.to >= today)) {
      // Add current rent as latest
      records.push({ from: p.leaseStart || '', to: p.leaseEnd || '', rent: p.rent, notes: '（基本月租）', type: 'current' });
    }

    // Sort all
    records.sort((a,b) => (a.from||'').localeCompare(b.from||''));

    const colMap = { history: '#3498db', tier: '#1e8449', current: '#888' };

    return `<div style="margin-bottom:20px;padding:14px;background:#f9f9f9;border-radius:8px;border-left:3px solid #1b3a6e">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-weight:600;font-size:14px">${p.name}</span>
        <button class="btn-ghost btn-sm" onclick="openRentHistModal('${p.id}')" style="font-size:11px">✎ 編輯記錄</button>
      </div>
      ${records.length === 0
        ? '<span style="color:#aaa;font-size:12px">無記錄</span>'
        : records.map(r => `
          <div style="font-size:12px;padding:3px 0;display:flex;gap:10px;align-items:baseline">

// ============================================================
const FS_FILENAME = 'rental_data.json';

// Central IndexedDB open — version 2 adds 'userdata' store (no size limit)
function _openRentalDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('rentalFSDB', 2);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('handles'))  db.createObjectStore('handles');
      if (!db.objectStoreNames.contains('userdata')) db.createObjectStore('userdata');
    };
    req.onsuccess  = e => resolve(e.target.result);
    req.onerror    = e => reject(e.target.error);
  });
}
async function saveHandleToDB(handle) {
  try {
    const db = await _openRentalDB();
    await new Promise((res, rej) => {
      const tx = db.transaction('handles', 'readwrite');
      tx.objectStore('handles').put(handle, 'dir');
      tx.oncomplete = res; tx.onerror = rej;
    });
  } catch(e) { console.warn('saveHandleToDB', e); }
}
async function loadHandleFromDB() {
  try {
    const db = await _openRentalDB();
    return await new Promise((res, rej) => {
      const tx = db.transaction('handles', 'readonly');
      const req = tx.objectStore('handles').get('dir');
      req.onsuccess = e => res(e.target.result || null);
      req.onerror   = e => rej(e.target.error);
    });
  } catch(e) { return null; }
}
// Save full JSON (including binary lease files) to IndexedDB — no size limit
async function saveUserDataToDB(uname, json) {
  try {
    const db = await _openRentalDB();
    await new Promise((res, rej) => {
      const tx = db.transaction('userdata', 'readwrite');
      tx.objectStore('userdata').put(json, uname);
      tx.oncomplete = res; tx.onerror = rej;
    });
  } catch(e) { console.warn('saveUserDataToDB', e); }
}
// Load full JSON from IndexedDB — returns string or null
async function loadUserDataFromDB(uname) {
  try {
    const db = await _openRentalDB();
    return await new Promise((res, rej) => {
      const tx = db.transaction('userdata', 'readonly');
      const req = tx.objectStore('userdata').get(uname);
      req.onsuccess = e => res(e.target.result || null);
      req.onerror   = e => rej(e.target.error);
    });
  } catch(e) { return null; }
}
async function deleteUserDataFromDB(uname) {
  try {
    const db = await _openRentalDB();
    await new Promise((res, rej) => {
      const tx = db.transaction('userdata', 'readwrite');
      tx.objectStore('userdata').delete(uname);
      tx.oncomplete = res; tx.onerror = rej;
    });
  } catch(e) {}
}
// Strip binary data (base64) from payload for localStorage / Firebase (size limits)
function _lightPayload(payload) {
  const stripProps = (props) => (props || []).map(p => ({
    ...p,
    leaseFiles:  (p.leaseFiles  || []).map(f => { const {data, ...rest} = f; return rest; }),
    leaseDrafts: (p.leaseDrafts || []).map(f => { const {data, ...rest} = f; return rest; }),
    maintenanceLogs: (p.maintenanceLogs || []).map(l => ({
      ...l, photos: (l.photos || []).map(ph => { const {data, ...rest} = ph; return rest; }),
    })),
  }));
  return { ...payload, properties: stripProps(payload.properties) };
}

async function initFS() {
  if (!window.showDirectoryPicker) {
    updateFolderStatus('unsupported');
    return;
  }
  const handle = await loadHandleFromDB();
  if (!handle) { updateFolderStatus('none'); return; }
  try {
    const perm = await handle.queryPermission({ mode: 'readwrite' });
    if (perm === 'granted') {
      _dirHandle = handle;
      const loaded = await loadFromFile();
      updateFolderStatus('connected', handle.name);
      if (loaded) { renderView(); showToast('📂 已從資料夾載入：' + handle.name); }
    } else {
      updateFolderStatus('needs-permission', handle.name);
    }
  } catch(e) { updateFolderStatus('none'); }
}

async function pickFolder() {
  if (!window.showDirectoryPicker) {
    showToast('❌ 請使用 Chrome 或 Edge 瀏覽器');
    return;
  }
  try {
    const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
    _dirHandle = handle;
    await saveHandleToDB(handle);
    const loaded = await loadFromFile();
    updateFolderStatus('connected', handle.name);
    if (loaded) { renderView(); showToast('✅ 已連結資料夾並載入資料：' + handle.name); }
    else { showToast('✅ 已連結資料夾：' + handle.name + '（將在下次存檔時建立 rental_data.json）'); }
  } catch(e) {
    if (e.name !== 'AbortError') showToast('❌ ' + (e.message || e));
  }
}

async function reconnectFolder() {
  const handle = await loadHandleFromDB();
  if (!handle) { pickFolder(); return; }
  try {
    const perm = await handle.requestPermission({ mode: 'readwrite' });
    if (perm === 'granted') {
      _dirHandle = handle;
      const loaded = await loadFromFile();
      updateFolderStatus('connected', handle.name);
      if (loaded) { renderView(); showToast('✅ 重新連結並載入：' + handle.name); }
    }
  } catch(e) { showToast('❌ ' + (e.message || e)); }
}

async function saveToFile(jsonStr) {
  if (!_dirHandle) return;
  try {
    // Use the caller-supplied JSON (same savedAt as localStorage) if provided
    const content = jsonStr || JSON.stringify({
      savedAt: new Date().toISOString(),
      profile: state.profile, properties: state.properties,
      taxSettings: state.taxSettings, telegram: state.telegram,
    }, null, 2);
    const fh = await _dirHandle.getFileHandle(FS_FILENAME, { create: true });
    const writable = await fh.createWritable();
    await writable.write(content);
    await writable.close();
  } catch(e) {
    console.warn('saveToFile error', e);
    if (e.name === 'NotAllowedError') { _dirHandle = null; updateFolderStatus('disconnected'); }
  }
}

async function loadFromFile() {
  if (!_dirHandle) return false;
  try {
    const fh = await _dirHandle.getFileHandle(FS_FILENAME);
    const file = await fh.getFile();
    const data = JSON.parse(await file.text());
    // Only override state when file is strictly newer than localStorage.
    // Prevents a stale file from overwriting a just-imported localStorage copy.
    const uname = state.profile.username;
    const localRaw = uname ? localStorage.getItem('rentalUserData_' + uname) : null;
    let localTime = '';
    if (localRaw) { try { localTime = JSON.parse(localRaw).savedAt || ''; } catch(e) {} }
    const fileTime = data.savedAt || '';
    if (fileTime < localTime) return false; // localStorage is newer — skip file
    if (data.properties) state.properties = data.properties;
    if (data.taxSettings) Object.assign(state.taxSettings, data.taxSettings);
    if (data.telegram) Object.assign(state.telegram, data.telegram);
    return true;
  } catch(e) {
    if (e.name !== 'NotFoundError') console.warn('loadFromFile', e);
    return false;
  }
}

function updateFolderStatus(status, name) {
  const el = document.getElementById('folder-status-wrap');
  if (!el) return;
  const shortName = name ? (name.length > 16 ? name.slice(0,14)+'…' : name) : '';
  const changeBtn = `<button class="pb-btn" onclick="pickFolder()" style="padding:3px 7px;font-size:10px;opacity:.7" title="變更資料夾">變更</button>`;
  if (status === 'connected') {
    el.innerHTML = `<span style="color:#a3e0b0;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px" title="📁 ${name} → ${FS_FILENAME}">📁 ${shortName}</span>${changeBtn}`;
  } else if (status === 'needs-permission') {
    el.innerHTML = `<button class="pb-btn" onclick="reconnectFolder()" style="background:rgba(234,179,8,.25);border-color:rgba(234,179,8,.6);font-size:11px;padding:3px 8px" title="重新授權讀寫 ${name}">🔑 重新授權</button>${changeBtn}`;
  } else if (status === 'unsupported') {
    el.innerHTML = `<span style="color:#f0a0a0;font-size:11px" title="請改用 Chrome 或 Edge">⚠️ 不支援</span>`;
  } else if (status === 'disconnected') {
    el.innerHTML = `<button class="pb-btn" onclick="pickFolder()" style="background:rgba(239,68,68,.2);border-color:rgba(239,68,68,.5);font-size:11px;padding:3px 8px">📂 重新連結</button>`;
  } else { // 'none'
    el.innerHTML = `<button class="pb-btn" onclick="pickFolder()" style="background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3);font-size:11px;padding:3px 8px" title="選擇存放資料夾，之後自動儲存到 rental_data.json">📂 選擇資料夾</button>`;
  }
}

function saveDisplayName(val) {
  state.profile.displayName = val.trim();
  saveUserData();
  if (val.trim()) showToast('✅ 顯示名稱已儲存：' + val.trim());
}


function saveUserData() {
  const uname = state.profile.username;
  if (!uname) return;
  const savedAt = new Date().toISOString();
  const payload = {
    properties: state.properties,
    taxSettings: state.taxSettings,
    telegram: state.telegram,
    savedAt,
  };
  // Full JSON (with base64 binary) -> IndexedDB (no size limit)
  const fullJson = JSON.stringify(payload);
  saveUserDataToDB(uname, fullJson);

  // Light JSON (binary stripped) -> localStorage + Firebase (size-limited)
  const lightJson = JSON.stringify(_lightPayload(payload));
  try {
    localStorage.setItem('rentalUserData_' + uname, lightJson);
    const lbl = document.getElementById('last-saved-label');
    if (lbl) lbl.textContent = (_dirHandle ? '📁 ' : '') + '自動儲存 ' + new Date().toLocaleTimeString('zh-TW');
  } catch(e) {
    console.error('saveUserData: localStorage quota exceeded', e);
    showToast('⚠️ localStorage 已滿，但資料已儲存到瀏覽器 IndexedDB，登出後仍可還原。', 6000);
  }
  fbPatch(_fbUserPath(), { userData: _fbS(lightJson) });
  saveToFile(fullJson); // save full data (binary included) to local folder file
}

async function loadUserData(uname) {
  if (!uname) return;
  state.properties = []; // clear before loading to avoid cross-account bleed
  // Try IndexedDB first (full data with binary lease files)
  const idbRaw = await loadUserDataFromDB(uname);
  if (idbRaw) {
    try {
      const d = JSON.parse(idbRaw);
      if (d.properties)  state.properties  = d.properties;
      if (d.taxSettings) Object.assign(state.taxSettings, d.taxSettings);
      if (d.telegram)    Object.assign(state.telegram, d.telegram);
      return;
    } catch(e) {}
  }
  // Fallback: localStorage (light data, no binary)
  const raw = localStorage.getItem('rentalUserData_' + uname);
  if (!raw) return;
  try {
    const d = JSON.parse(raw);
    if (d.properties)  state.properties  = d.properties;
    if (d.taxSettings) Object.assign(state.taxSettings, d.taxSettings);
    if (d.telegram)    Object.assign(state.telegram, d.telegram);
  } catch(e) {}
}

function getAllUsers() {
  try { return JSON.parse(localStorage.getItem('rentalAllUsers') || '[]'); }
  catch(e) { return []; }
}

function registerUser(uname) {
  const users = getAllUsers();
  if (!users.includes(uname)) {
    users.push(uname);
    localStorage.setItem('rentalAllUsers', JSON.stringify(users));
  }
}

function unregisterUser(uname) {
  const users = getAllUsers().filter(u => u !== uname);
  localStorage.setItem('rentalAllUsers', JSON.stringify(users));
  localStorage.removeItem('rentalUserData_' + uname);
  deleteUserDataFromDB(uname); // also remove from IndexedDB
}

function adminToggleUser(uname) {

  if (!raw) { content.innerHTML = '<span style="color:rgba(255,255,255,.3)">無儲存資料</span>'; return; }
  try {
    const d = JSON.parse(raw);
    const props = d.properties || [];
    if (props.length === 0) { content.innerHTML = '<span style="color:rgba(255,255,255,.3)">此用戶尚無房產資料</span>'; return; }
    const fmtN = n => Math.round(n||0).toLocaleString('zh-TW');
    const fmtD = s => s ? s.replace(/-/g,'/') : '—';
    const today = new Date();
    let rows = props.map(p => {
      const rent = (p.rent||0) + (p.parking==='separate'?p.parkingFee||0:0);
      let daysLeft = '—', daysColor = '';
      if (p.leaseEnd) {
        const d2 = Math.round((new Date(p.leaseEnd)-today)/86400000);
        daysLeft = d2 > 0 ? d2+'天' : '已到期';
        daysColor = d2 < 30 ? 'color:#ff7b7b' : d2 < 90 ? 'color:#ffb347' : 'color:#5ddb94';
      }
      const pLabel = p.parking==='included'?`含車位${p.parkingNo?'（'+p.parkingNo+'）':''}`:p.parking==='separate'?`另計 $${fmtN(p.parkingFee)}${p.parkingNo?'（'+p.parkingNo+'）':''}`: '無車位';
      return `<tr>
        <td>${p.name||'—'}</td>
        <td>${p.city||''}${p.district||''}</td>
        <td>$${fmtN(rent)}</td>
        <td>${pLabel}</td>
        <td>${fmtD(p.leaseStart)} ~ ${fmtD(p.leaseEnd)}</td>
        <td style="${daysColor}">${daysLeft}</td>
      </tr>`;
    }).join('');
    content.innerHTML = `
      <table class="admin-drawer-table">
        <thead><tr>
          <th>房產名稱</th><th>地址</th><th>月租</th><th>車位</th><th>租約期間</th><th>剩餘天數</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div style="margin-top:8px;color:rgba(255,200,200,.4);font-size:11px">
        最後儲存：${d.savedAt ? new Date(d.savedAt).toLocaleString('zh-TW') : '未知'}
      </div>`;
  } catch(e) {
    content.innerHTML = '<span style="color:#ff7b7b">資料解析失敗</span>';
  }
}

function adminResetPwd(uname) {
  const newPwd = prompt(`重設「${uname}」的密碼\n\n請輸入新密碼（至少 6 個字元）：`);
  if (newPwd === null) return;
  if (newPwd.length < 6) { alert('密碼至少 6 個字元'); return; }
  hashPwd(newPwd).then(h => {
    localStorage.setItem('rentalPwdHash_' + uname, h);
    if (uname === localStorage.getItem('rentalUsername')) {
      localStorage.setItem('rentalPwdHash', h);
    }
    fbPatch(`users/${uname}`, { pwdHash: _fbS(h) }); // sync to Firebase
    renderAdminBody();
    showToast(`✅「${uname}」密碼已重設`);
  });
}

function adminDeleteUser(uname) {
  if (!confirm(`確定刪除用戶「${uname}」？\n此操作將移除該用戶的所有房產資料，無法復原。`)) return;
  unregisterUser(uname);
  localStorage.removeItem('rentalPwdHash_' + uname);
  if (uname === localStorage.getItem('rentalUsername')) {
    localStorage.removeItem('rentalPwdHash');
    localStorage.removeItem('rentalUsername');
  }
  fbDelete(`users/${uname}`); // also remove from Firebase cloud
  renderAdminBody();
  showToast(`🗑「${uname}」已刪除`);
}

function closeAdminOverlay() {

async function fbAdminDeleteUser(username) {
  if (!confirm(`確定從 Firebase 刪除「${username}」的雲端資料？\n\n本機資料不受影響，但該用戶換裝置後將無法同步。`)) return;
  const ok = await fbDelete(`users/${username}`);

    showToast(`❌ 刪除失敗，請確認網路連線`);
  }
}

// ============================================================
// AUTH — Login / Password (localStorage, SHA-256 hash)
// ============================================================
async function hashPwd(pwd) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pwd));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function initLoginScreen() {
  const overlay = document.getElementById('login-overlay');
  const storedHash = localStorage.getItem('rentalPwdHash');
  const storedUser = localStorage.getItem('rentalUsername');
  if (!storedHash) {
    // First run — setup mode
    document.getElementById('login-sub').textContent = '首次使用 / 已有帳號請輸入相同名稱與密碼';
    document.getElementById('login-setup-section').style.display = 'block';
  } else {
    // Returning user — login mode
    const uname = storedUser || '使用者';
    document.getElementById('login-sub').textContent = `歡迎回來，${uname}`;
    document.getElementById('login-name-label').textContent = `${uname} 的密碼`;
    document.getElementById('login-login-section').style.display = 'block';
  }
  overlay.style.display = 'flex';
}

async function doSetup() {
  const uname = document.getElementById('setup-username').value.trim();
  const pwd   = document.getElementById('setup-pwd').value;
  const pwd2  = document.getElementById('setup-pwd2').value;
  const errEl = document.getElementById('setup-err');
  errEl.textContent = '';
  if (!uname)              { errEl.textContent = '⚠️ 請填入名稱'; return; }
  if (pwd.length < 6)      { errEl.textContent = '⚠️ 密碼至少 6 個字元'; return; }
  if (pwd !== pwd2)        { errEl.textContent = '⚠️ 兩次密碼不一致'; return; }
  const h = await hashPwd(pwd);

  // Firebase Auth is now the primary credential — try sign-in first
  errEl.textContent = '🔐 驗證身份中…';
  let isNewAccount = false;
  try {
    _faSetSession(await _faSignIn(uname, pwd));
  } catch(e) {
    const msg = e.message || '';
    if (msg.includes('INVALID_PASSWORD')) {
      errEl.textContent = '❌ 此帳號已存在於雲端，密碼不正確'; return;
    }
    // INVALID_LOGIN_CREDENTIALS now covers both wrong email AND wrong password in Firebase
    // → always attempt signUp; if account truly exists, signUp returns EMAIL_EXISTS
    try {
      _faSetSession(await _faSignUp(uname, pwd));
      isNewAccount = true;
    } catch(e2) {
      const m2 = e2.message || '';
      if (m2.includes('EMAIL_EXISTS')) {
        errEl.textContent = '❌ 此帳號已存在於雲端，密碼不正確';
      } else {
        errEl.textContent = '❌ 建立帳號失敗：' + m2;
      }
      return;
    }
  }

  // Store local credentials
  localStorage.setItem('rentalPwdHash_' + uname, h);
  localStorage.setItem('rentalPwdHash', h);
  localStorage.setItem('rentalUsername', uname);
  state.profile.username = uname;
  registerUser(uname);

  if (!isNewAccount) {
    // Existing account on new device — migrate & sync data
    errEl.textContent = '🔄 同步雲端資料中…';
    await _migrateToUid(uname); // move data from users/{username} to users/{uid} if needed
    const uidDoc = await fbGet(`users/${_fbUid}`);
    const rawData = _fbR(uidDoc, 'userData');
    if (rawData) {
      localStorage.setItem('rentalUserData_' + uname, rawData);
      await loadUserData(uname);
    }
    errEl.textContent = '';
    document.getElementById('login-overlay').style.display = 'none';
    renderView();
    initFS();
    showToast('☁️ 已從雲端同步帳號資料，歡迎回來！');
  } else {
    // Brand-new account
    const ui = document.getElementById('username-input');
    if (ui) ui.value = '';
    saveUserData();
    fbPatch(_fbUserPath(), { pwdHash: _fbS(h) });
    errEl.textContent = '';
    document.getElementById('login-overlay').style.display = 'none';
    renderView();
    initFS();
    showToast('✅ 帳號建立成功，歡迎使用！');
  }
}

async function doLogin() {
  const pwd   = document.getElementById('login-pwd').value;
  const errEl = document.getElementById('login-err');
  errEl.textContent = '';
  if (!pwd) { errEl.textContent = '⚠️ 請輸入密碼'; return; }
  const uname = localStorage.getItem('rentalUsername') || '';
  // Check per-user hash first (set by admin reset), fall back to shared key
  const perUserHash = localStorage.getItem('rentalPwdHash_' + uname);
  const storedHash  = perUserHash || localStorage.getItem('rentalPwdHash');
  const h = await hashPwd(pwd);
  if (h !== storedHash) { errEl.textContent = '❌ 密碼錯誤，請再試一次'; return; }
  // Keep the per-user hash so switching back to this account later still works;
  // sync the shared key so it always reflects the currently active user
  localStorage.setItem('rentalPwdHash', storedHash);
  localStorage.setItem('rentalPwdHash_' + uname, storedHash);
  state.profile.username = uname;
  const ui = document.getElementById('username-input');
  if (ui) ui.value = uname;
  await loadUserData(uname); // restore local data (IDB first, then localStorage)
  document.getElementById('login-overlay').style.display = 'none';
  renderView();
  showToast('✅ 登入成功');
  initFS();
  // Firebase Auth — now awaited so _fbUid is ready for uid-based Firestore paths
  await _faAuth(uname, pwd);
  await _migrateToUid(uname); // migrate once if data still at username path
  // Background: sync with Firebase (upload if empty, download if newer)
  fbGet(_fbUserPath()).then(doc => {
    const raw = _fbR(doc, 'userData');
    const localRaw = localStorage.getItem('rentalUserData_' + uname);
    if (!raw) {
      // Firebase is empty → upload local data and hash now
      if (localRaw) {
        fbPatch(_fbUserPath(), { pwdHash: _fbS(storedHash), userData: _fbS(localRaw) });
        showToast('☁️ 資料已首次同步至雲端');
      }
      return;
    }
    try {
      const d = JSON.parse(raw);
      const localTime = localRaw ? (JSON.parse(localRaw).savedAt || '') : '';
      const fbTime    = d.savedAt || '';
      if (fbTime > localTime) {
        // Firebase is newer — apply remote metadata but preserve local binary (lease files, photos)
        const _idbBin = {};
        (state.properties || []).forEach(p => { _idbBin[p.id] = p; });
        if (d.properties) {
          state.properties = d.properties.map(p => {
            const loc = _idbBin[p.id] || {};
            return {
              ...p,
              leaseFiles:  (p.leaseFiles  || []).map(f => { const l=(loc.leaseFiles||[]).find(x=>x.id===f.id); return l&&l.data?{...f,data:l.data}:f; }),
              leaseDrafts: (p.leaseDrafts || []).map(f => { const l=(loc.leaseDrafts||[]).find(x=>x.id===f.id); return l&&l.data?{...f,data:l.data}:f; }),
              maintenanceLogs: (p.maintenanceLogs || []).map(l => ({
                ...l,
                photos: (l.photos||[]).map(ph => {
                  const ll=(loc.maintenanceLogs||[]).find(x=>x.id===l.id);
                  const lph=ll?(ll.photos||[]).find(x=>x.id===ph.id):null;
                  return lph&&lph.data?{...ph,data:lph.data}:ph;
                }),
              })),
            };
          });
        }
        if (d.taxSettings) Object.assign(state.taxSettings, d.taxSettings);
        if (d.telegram)    Object.assign(state.telegram, d.telegram);
        saveUserData(); // persist merged result to IDB + localStorage
        renderView();
        showToast('☁️ 已從雲端同步最新資料（本機租約文件已保留）');
      }
    } catch(e) {}
  });
}

function toggleUserSwitch() {
  const panel = document.getElementById('login-switch-panel');
  if (panel.style.display !== 'none') { panel.style.display = 'none'; panel.innerHTML = ''; return; }
  const curUser = localStorage.getItem('rentalUsername') || '';
  const others = getAllUsers().filter(u => u !== curUser);
  const rows = others.map(u =>
    `<div class="login-switch-item" onclick="switchToUser(this.dataset.u)" data-u="${u.replace(/"/g,'&quot;')}">👤 ${u}</div>`
  ).join('') || `<div style="color:rgba(255,255,255,.35);font-size:12px;text-align:center;padding:4px 0">沒有其他已註冊帳號</div>`;
  panel.innerHTML = `${rows}<div class="login-switch-item" onclick="startNewAccountSetup()">➕ 新增其他帳號</div>`;
  panel.style.display = 'block';
}

function switchToUser(uname) {
  localStorage.setItem('rentalUsername', uname);
  document.getElementById('login-pwd').value = '';
  document.getElementById('login-err').textContent = '';
  document.getElementById('login-switch-panel').style.display = 'none';
  document.getElementById('login-switch-panel').innerHTML = '';
  initLoginScreen();
}

function startNewAccountSetup() {
  document.getElementById('login-switch-panel').style.display = 'none';
  document.getElementById('login-switch-panel').innerHTML = '';
  document.getElementById('login-login-section').style.display = 'none';
  document.getElementById('login-setup-section').style.display = 'block';
  document.getElementById('login-sub').textContent = '新增帳號';
  document.getElementById('setup-username').value = '';
  document.getElementById('setup-pwd').value = '';
  document.getElementById('setup-pwd2').value = '';
  document.getElementById('setup-err').textContent = '';
}

function doLogout() {
  _faSignOut();  // clear Firebase Auth token
  resetState(); // clear all user data from memory before showing login
  const overlay = document.getElementById('login-overlay');
  document.getElementById('login-setup-section').style.display = 'none';
  document.getElementById('login-login-section').style.display = 'none';
  const storedHash = localStorage.getItem('rentalPwdHash');
  const storedUser = localStorage.getItem('rentalUsername') || '使用者';
  if (!storedHash) {
    document.getElementById('login-sub').textContent = '首次使用 / 已有帳號請輸入相同名稱與密碼';
    document.getElementById('login-setup-section').style.display = 'block';
  } else {
    document.getElementById('login-sub').textContent = `歡迎回來，${storedUser}`;
    document.getElementById('login-name-label').textContent = `${storedUser} 的密碼`;
    document.getElementById('login-login-section').style.display = 'block';
    document.getElementById('login-pwd').value = '';
    document.getElementById('login-err').textContent = '';
  }
  overlay.style.display = 'flex';
}

function doResetPrompt() {
  if (!confirm('確定要清除帳號密碼？下次進入將重新設定。\n（房產資料不受影響）')) return;
  localStorage.removeItem('rentalPwdHash');
  localStorage.removeItem('rentalUsername');
  doLogout();
}

async function changePassword() {
  const oldPwd = document.getElementById('cp-old').value;
  const newPwd = document.getElementById('cp-new').value;
  const newPwd2 = document.getElementById('cp-new2').value;
  const msgEl = document.getElementById('cp-msg');
  msgEl.textContent = '';
  const storedHash = localStorage.getItem('rentalPwdHash');
  if (!storedHash) { msgEl.style.color='#c0392b'; msgEl.textContent='尚未設定密碼，請先登出再設定。'; return; }
  if (!oldPwd) { msgEl.style.color='#c0392b'; msgEl.textContent='⚠️ 請輸入目前密碼'; return; }
  const oldH = await hashPwd(oldPwd);
  if (oldH !== storedHash) { msgEl.style.color='#c0392b'; msgEl.textContent='❌ 目前密碼錯誤'; return; }
  if (newPwd.length < 6) { msgEl.style.color='#c0392b'; msgEl.textContent='⚠️ 新密碼至少 6 個字元'; return; }
  if (newPwd !== newPwd2) { msgEl.style.color='#c0392b'; msgEl.textContent='⚠️ 兩次密碼不一致'; return; }
  const newH = await hashPwd(newPwd);
  const curUser = state.profile.username;
  localStorage.setItem('rentalPwdHash', newH);
  if (curUser) {
    localStorage.setItem('rentalPwdHash_' + curUser, newH);
    fbPatch(`users/${curUser}`, { pwdHash: _fbS(newH) }); // sync to Firebase
  }
  document.getElementById('cp-old').value = '';
  document.getElementById('cp-new').value = '';
  document.getElementById('cp-new2').value = '';
  msgEl.style.color='#1e8449'; msgEl.textContent='✅ 密碼已更新！';
  setTimeout(()=>{ if(msgEl) msgEl.textContent=''; }, 3000);
}
