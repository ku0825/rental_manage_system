<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>房東租賃分析管理系統</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<script src="https://www.google.com/recaptcha/api.js?render=6Ld3P6YtAAAAAOWEvRzRAdcWJlMuxuIIsaYcECMb" async defer></script>
<style>
:root {
  --primary: #1b3a6e; --primary-light: #2d5a9e;
  --accent: #e07b2a; --green: #1e8449; --red: #c0392b;
  --yellow: #d4850a; --sidebar-w: 230px; --bg: #f0f3f8;
}
* { box-sizing: border-box; }
body { font-family: 'Microsoft JhengHei','Noto Sans TC',sans-serif; background: var(--bg); color: #222; margin: 0; }

/* Sidebar */
.sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-w); background: var(--primary); color: #fff; display: flex; flex-direction: column; z-index: 200; box-shadow: 2px 0 8px rgba(0,0,0,.18); }
.sidebar-logo { padding: 18px 20px 14px; border-bottom: 1px solid rgba(255,255,255,.12); font-size: 15px; font-weight: 700; line-height: 1.4; }
.sidebar-logo span { font-size: 11px; font-weight: 400; opacity: .7; display: block; margin-top: 2px; }
.nav-section { padding: 12px 0 4px; font-size: 10px; color: rgba(255,255,255,.45); letter-spacing: 1px; padding-left: 20px; }
.nav-item { padding: 10px 20px; cursor: pointer; display: flex; align-items: center; gap: 11px; font-size: 13.5px; transition: background .15s; border-left: 3px solid transparent; color: rgba(255,255,255,.85); }
.nav-item:hover { background: rgba(255,255,255,.09); color: #fff; }
.nav-item.active { background: rgba(255,255,255,.14); border-left-color: var(--accent); color: #fff; font-weight: 600; }
.nav-item svg { opacity: .8; flex-shrink: 0; }
.nav-add-btn { margin: 10px 14px 6px; padding: 9px 16px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; justify-content: center; transition: opacity .15s; }
.nav-add-btn:hover { opacity: .88; }
.sidebar-footer { margin-top: auto; padding: 12px 20px; font-size: 11px; color: rgba(255,255,255,.35); border-top: 1px solid rgba(255,255,255,.1); }

/* Profile bar */
.profile-bar { background: var(--primary); color: #fff; padding: 8px 20px; display: flex; flex-wrap: wrap; row-gap: 8px; align-items: center; gap: 16px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,.1); }
.profile-bar input { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.25); border-radius: 6px; color: #fff; padding: 4px 10px; font-size: 13px; font-family: inherit; outline: none; width: 160px; }
.profile-bar input::placeholder { color: rgba(255,255,255,.5); }
.profile-bar .pb-btn { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.25); border-radius: 6px; color: #fff; padding: 5px 12px; font-size: 12px; cursor: pointer; transition: background .15s; white-space: nowrap; }
.profile-bar .pb-btn:hover { background: rgba(255,255,255,.28); }
.profile-bar .pb-sep { color: rgba(255,255,255,.3); }

/* Mobile sidebar toggle + backdrop (hidden on desktop) */
.sidebar-toggle-btn {
  display: none; position: fixed; top: 10px; left: 10px; z-index: 210;
  width: 38px; height: 38px; border-radius: 8px; border: none;
  background: var(--primary); color: #fff; font-size: 18px; cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,.25); align-items: center; justify-content: center;
}
.sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 190; }
.sidebar-backdrop.show { display: block; }

@media (max-width: 860px) {
  .sidebar-toggle-btn { display: flex; }
  .sidebar { transform: translateX(-100%); transition: transform .25s ease; }
  .sidebar.open { transform: translateX(0); }
  .main, .profile-bar, .print-header { margin-left: 0 !important; }
  .profile-bar { padding-left: 56px; }
  .print-header { padding-left: 56px !important; }
}

/* Main */
.main { margin-left: var(--sidebar-w); min-height: 100vh; padding: 24px 26px 40px; }
.page-title { font-size: 22px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
.page-subtitle { font-size: 13px; color: #666; margin-bottom: 20px; }

/* Cards */
.card { background: #fff; border-radius: 12px; border: none; box-shadow: 0 1px 6px rgba(0,0,0,.07); }
.card-body { padding: 20px; }
.card-hdr { padding: 14px 20px; border-bottom: 1px solid #f0f0f0; font-weight: 700; font-size: 14px; color: var(--primary); display: flex; align-items: center; justify-content: space-between; }

/* Stat cards */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(175px,1fr)); gap: 14px; margin-bottom: 20px; }
.stat-card { background: #fff; border-radius: 12px; padding: 16px 18px; box-shadow: 0 1px 6px rgba(0,0,0,.07); }
.stat-card .s-label { font-size: 11px; color: #777; margin-bottom: 5px; }
.stat-card .s-value { font-size: 22px; font-weight: 700; color: var(--primary); }
.stat-card .s-sub { font-size: 11px; color: #999; margin-top: 3px; }
.stat-card.accent .s-value { color: var(--accent); }
.stat-card.green .s-value { color: var(--green); }
.stat-card.yellow .s-value { color: var(--yellow); }

/* Property cards */
.prop-card { background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 1px 6px rgba(0,0,0,.07); margin-bottom: 12px; border-left: 4px solid var(--primary-light); transition: box-shadow .15s; }
.prop-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.11); }

/* Badges */
.bdg { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.bdg-blue { background: #dce9fb; color: var(--primary); }
.bdg-green { background: #d5f0e3; color: var(--green); }
.bdg-red { background: #fde8e6; color: var(--red); }
.bdg-yellow { background: #fef3e2; color: var(--yellow); }
.bdg-gray { background: #eee; color: #666; }

/* Table */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { background: #f6f8fb; color: #555; font-weight: 600; font-size: 12px; padding: 9px 14px; text-align: left; border-bottom: 1px solid #e8edf4; }
.tbl td { padding: 10px 14px; border-bottom: 1px solid #f0f2f6; vertical-align: middle; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tbody tr:hover td { background: #f8faff; }

/* Buttons */
.btn-pri { background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 7px 16px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s; }
.btn-pri:hover { background: var(--primary-light); }
.btn-acc { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 7px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn-ghost { background: none; color: var(--primary-light); border: 1px solid var(--primary-light); border-radius: 8px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
.btn-ghost-red { background: none; color: var(--red); border: 1px solid #f5b7b1; border-radius: 8px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
.btn-ghost-g { background: none; color: var(--green); border: 1px solid #a9dfbf; border-radius: 8px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
.btn-sm { padding: 4px 10px !important; font-size: 11px !important; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 500; display: flex; align-items: flex-start; justify-content: center; padding: 28px 20px; overflow-y: auto; }
.modal-box { background: #fff; border-radius: 16px; width: 100%; max-width: 740px; overflow: hidden; }
.modal-hdr { padding: 20px 26px 16px; background: var(--primary); color: #fff; font-size: 16px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
.modal-close { background: none; border: none; color: rgba(255,255,255,.7); font-size: 22px; cursor: pointer; }
.modal-close:hover { color: #fff; }
.modal-body { padding: 22px 26px; max-height: calc(90vh - 80px); overflow-y: auto; }
.modal-foot { padding: 14px 26px; border-top: 1px solid #f0f0f0; display: flex; justify-content: flex-end; gap: 10px; }

/* Form */
.fsec { font-size: 12px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid #eee; padding-bottom: 7px; margin: 18px 0 12px; }
.frow { display: grid; grid-template-columns: repeat(auto-fill,minmax(175px,1fr)); gap: 12px; margin-bottom: 12px; }
.fg { display: flex; flex-direction: column; gap: 4px; }
.fg label { font-size: 12px; font-weight: 600; color: #555; }
.fg input,.fg select,.fg textarea { border: 1px solid #dde3ee; border-radius: 8px; padding: 7px 11px; font-size: 13px; outline: none; transition: border-color .15s; font-family: inherit; }
.fg input:focus,.fg select:focus { border-color: var(--primary-light); }
.fhint { font-size: 11px; color: #999; }
.pfx-wrap { display: flex; }
.pfx-wrap .pfx { background: #f4f6fb; border: 1px solid #dde3ee; border-right: none; border-radius: 8px 0 0 8px; padding: 7px 9px; font-size: 12px; color: #888; }
.pfx-wrap input { border-radius: 0 8px 8px 0; flex: 1; }

/* Info boxes */
.ibox { border-radius: 9px; padding: 12px 14px; margin: 10px 0; font-size: 13px; }
.ibox-blue { background: #f0f7ff; border: 1px solid #bee3f8; }
.ibox-warn { background: #fff9f0; border: 1px solid #f6d2a9; }
.ibox-green { background: #f0faf4; border: 1px solid #a9dfbf; }
.ibox-red { background: #fdf5f4; border: 1px solid #f5b7b1; }
.ibox-dark { background: #f0f3f8; border: 1px solid #dde3ee; }

/* Highlight result */
.result-hl { background: linear-gradient(135deg,var(--primary),var(--primary-light)); color: #fff; border-radius: 12px; padding: 20px 22px; }
.result-hl .rh-label { font-size: 11px; opacity: .8; margin-bottom: 3px; }
.result-hl .rh-value { font-size: 26px; font-weight: 700; }
.result-hl .rh-sub { font-size: 11px; opacity: .7; margin-top: 3px; }

/* Market bar */
.mbar-track { height: 10px; background: #e8edf4; border-radius: 5px; position: relative; }
.mbar-range { position: absolute; top: 0; height: 100%; background: #bee3f8; border-radius: 5px; }
.mbar-dot { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; transform: translate(-50%,-50%); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.2); }

/* Bracket bar */
.bbar { margin: 5px 0; }
.bbar-lbl { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-bottom: 3px; }
.bbar-track { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; }
.bbar-fill { height: 100%; border-radius: 4px; }

/* Layout */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
@media (max-width: 900px) { .two-col,.three-col { grid-template-columns: 1fr; } }

/* Misc */
.divider { border: none; border-top: 1px solid #eee; margin: 16px 0; }
.tag-row { display: flex; flex-wrap: wrap; gap: 5px; }
.empty-state { text-align: center; padding: 50px 20px; color: #aaa; }
.empty-state .es-icon { font-size: 44px; margin-bottom: 12px; }
.confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 600; display: flex; align-items: center; justify-content: center; }
.confirm-box { background: #fff; border-radius: 12px; padding: 26px; max-width: 370px; width: 90%; text-align: center; }

/* ─── LOGIN OVERLAY ─── */
#login-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: linear-gradient(135deg, #0d1f3c 0%, #1b3a6e 60%, #2d5a9e 100%);
  display: flex; align-items: center; justify-content: center;
}
.login-box {
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.15);
  border-radius: 20px; padding: 44px 48px 40px; width: 380px; max-width: 94vw;
  backdrop-filter: blur(12px); box-shadow: 0 24px 60px rgba(0,0,0,.45);
}
.login-logo { text-align: center; font-size: 42px; margin-bottom: 10px; }
.login-title { text-align: center; color: #fff; font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.login-sub { text-align: center; color: rgba(255,255,255,.5); font-size: 13px; margin-bottom: 28px; }
.login-label { display: block; color: rgba(255,255,255,.7); font-size: 12px; font-weight: 600; margin-bottom: 6px; letter-spacing: .5px; }
.login-input {
  width: 100%; padding: 11px 14px; border-radius: 10px;
  border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08);
  color: #fff; font-size: 14px; outline: none; margin-bottom: 16px;
  transition: border-color .2s;
}
.login-input:focus { border-color: rgba(255,255,255,.5); background: rgba(255,255,255,.12); }
.login-input::placeholder { color: rgba(255,255,255,.3); }
.login-btn {
  width: 100%; padding: 13px; border: none; border-radius: 10px;
  background: var(--accent); color: #fff; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: opacity .15s; margin-top: 4px;
}
.login-btn:hover { opacity: .88; }
.login-err { color: #ff7b7b; font-size: 12px; text-align: center; margin-top: 10px; min-height: 18px; }
.login-hint { color: rgba(255,255,255,.35); font-size: 11px; text-align: center; margin-top: 14px; }
.login-reset-link { color: rgba(255,255,255,.4); font-size: 11px; text-align: center; margin-top: 8px; cursor: pointer; text-decoration: underline; }
.login-reset-link:hover { color: rgba(255,255,255,.7); }
.login-switch-item {
  padding: 9px 12px; border-radius: 8px; margin-top: 6px;
  background: rgba(255,255,255,.06); color: rgba(255,255,255,.85);
  font-size: 13px; cursor: pointer; transition: background .15s;
}
.login-switch-item:hover { background: rgba(255,255,255,.14); }

/* ─── LEASE FILES ─── */
.lease-section { margin-top:10px; border-top:1px solid #f0f0f0; padding-top:10px; }
.lease-section-hdr { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.lease-section-title { font-size:12px; font-weight:600; color:#555; }
.lease-file-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:6px; margin-bottom:6px; }
.lease-file-card {
  background:#f8faff; border:1px solid #dde3ee; border-radius:8px;
  padding:8px 10px; cursor:pointer; transition:all .15s; position:relative;
}
.lease-file-card:hover { background:#eef3ff; border-color:#b8c8ee; }
.lease-file-card.archived { background:#fafafa; border-color:#e0e0e0; opacity:.75; }
.lease-file-icon { font-size:18px; margin-bottom:3px; }
.lease-file-name { font-size:10px; color:#444; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lease-file-meta { font-size:9px; color:#aaa; margin-top:2px; }
.lease-file-status { display:inline-block; font-size:9px; font-weight:700; padding:1px 5px; border-radius:10px; margin-top:3px; }
.lfs-active   { background:#d4edda; color:#1e8449; }
.lfs-archived { background:#f0f0f0; color:#888; }
.lease-empty-slot { background:#fafeff; border:1.5px dashed #c8d8ee; border-radius:8px; padding:8px 10px; display:flex; align-items:center; justify-content:center; font-size:10px; color:#bbb; min-height:52px; }
.lease-storage-bar { background:#eef0f5; border-radius:4px; height:4px; margin-top:6px; overflow:hidden; }
.lease-storage-fill { height:100%; border-radius:4px; transition:width .3s; }
/* ── View toggle ── */
.view-tog { display:inline-flex; border-radius:8px; overflow:hidden; border:1px solid #dde3ee; }
.view-tog-btn { background:#fff; border:none; padding:6px 13px; font-size:12px; cursor:pointer; color:#666; transition:all .15s; font-family:inherit; }
.view-tog-btn.vtb-on { background:var(--primary); color:#fff; }
/* ── Collapsible prop sections ── */
.prop-sec-hdr { display:flex; justify-content:space-between; align-items:center; cursor:pointer; padding:8px 0; border-top:1px solid #f0f0f0; margin-top:10px; user-select:none; }
.prop-sec-hdr:hover .prop-sec-title { color:var(--primary-light); }
.prop-sec-title { font-size:12px; font-weight:600; color:#555; transition:color .15s; }
/* ── Prop table view ── */
.prop-tbl { width:100%; border-collapse:separate; border-spacing:0; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 6px rgba(0,0,0,.07); }
.prop-tbl th { background:#f6f8fb; color:#555; font-weight:600; font-size:12px; padding:10px 14px; text-align:left; border-bottom:2px solid #e8edf4; }
.prop-tbl td { padding:10px 14px; border-bottom:1px solid #f0f2f6; font-size:13px; vertical-align:middle; }
.prop-tbl tbody tr:hover td { background:#f8faff; }
.prop-tbl tbody tr:last-child td { border-bottom:none; }
/* ── Lease preview split ── */
.lease-split { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.lease-prev-pane { background:#f5f7fb; border:1px solid #dde3ee; border-radius:8px; min-height:520px; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; position:sticky; top:0; }
.lease-prev-pane iframe { width:100%; height:580px; min-height:520px; border:none; }
.lease-prev-pane img { max-width:100%; max-height:580px; object-fit:contain; padding:10px; }
/* ─── ADMIN PANEL ─── */
#admin-overlay {
  position: fixed; inset: 0; z-index: 10000;
  background: rgba(10,10,20,.92);
  display: none; align-items: flex-start; justify-content: center;
  padding: 40px 20px; overflow-y: auto;
}
.admin-panel {
  background: #13172b; border: 1px solid rgba(255,80,80,.25);
  border-radius: 18px; width: 100%; max-width: 860px;
  box-shadow: 0 0 60px rgba(200,30,30,.25);
}
.admin-hdr {
  background: linear-gradient(135deg,#3d0000,#6b0000);
  border-radius: 18px 18px 0 0; padding: 20px 28px;
  display: flex; align-items: center; justify-content: space-between;
}
.admin-hdr-title { color:#fff; font-size:18px; font-weight:700; letter-spacing:.5px; }
.admin-hdr-sub   { color:rgba(255,200,200,.6); font-size:12px; margin-top:2px; }
.admin-body { padding: 24px 28px; }
.admin-section { color:rgba(255,100,100,.8); font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; margin:18px 0 10px; }
.admin-table { width:100%; border-collapse:collapse; }
.admin-table th { background:rgba(255,255,255,.05); color:rgba(255,255,255,.5); font-size:11px; font-weight:600; padding:9px 12px; text-align:left; letter-spacing:.5px; }
.admin-table td { padding:10px 12px; border-bottom:1px solid rgba(255,255,255,.06); color:rgba(255,255,255,.8); font-size:13px; vertical-align:middle; }
.admin-table tr:last-child td { border-bottom:none; }
.admin-table tr:hover td { background:rgba(255,255,255,.03); }
.admin-badge { display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; }
.admin-badge-green { background:rgba(30,132,73,.3); color:#5ddb94; border:1px solid rgba(30,132,73,.4); }
.admin-badge-gray  { background:rgba(255,255,255,.08); color:rgba(255,255,255,.4); border:1px solid rgba(255,255,255,.12); }
.admin-btn { display:inline-flex; align-items:center; gap:4px; padding:5px 11px; border-radius:7px; border:none; font-size:12px; font-weight:600; cursor:pointer; transition:opacity .15s; }
.admin-btn-view { background:rgba(45,90,158,.4); color:#7eb4ff; border:1px solid rgba(45,90,158,.5); }
.admin-btn-reset { background:rgba(180,100,0,.35); color:#ffb347; border:1px solid rgba(180,100,0,.45); }
.admin-btn-del   { background:rgba(150,0,0,.35); color:#ff7b7b; border:1px solid rgba(150,0,0,.45); }
.admin-btn:hover { opacity:.8; }
.admin-close-btn { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); color:rgba(255,255,255,.6); padding:7px 16px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; transition:opacity .15s; }
.admin-close-btn:hover { opacity:.75; }
/* Admin login box (reuses login styles but override colours) */
.admin-login-box {
  background: #13172b; border:1px solid rgba(255,80,80,.3);
  border-radius: 18px; padding: 44px 48px 40px; width:380px; max-width:94vw;
  box-shadow: 0 24px 60px rgba(200,30,30,.3);
}
.admin-login-box .login-title { color:#ff8888; }
.admin-login-box .login-sub   { color:rgba(255,200,200,.5); }
.admin-login-box .login-btn   { background:#6b0000; }
.admin-login-box .login-btn:hover { background:#8b0000; }
/* User detail drawer */
.admin-drawer { background:rgba(255,255,255,.04); border-radius:10px; padding:14px 16px; margin-top:8px; }
.admin-drawer-table { width:100%; font-size:12px; }
.admin-drawer-table th { color:rgba(255,200,200,.6); font-weight:600; padding:5px 8px; text-align:left; }
.admin-drawer-table td { color:rgba(255,255,255,.75); padding:5px 8px; border-bottom:1px solid rgba(255,255,255,.05); }
.admin-drawer-table tr:last-child td { border-bottom:none; }
/* Sidebar logo clickable */
.sidebar-logo { cursor:pointer; user-select:none; }
/* ─── PRINT ─── */
@media print {
  .sidebar,.profile-bar,.no-print { display: none !important; }
  .main { margin-left: 0 !important; padding: 0 !important; }
  #print-header { margin-left: 0 !important; }
  body { background: #fff; }
  .prop-card,.card,.stat-card { box-shadow: none !important; border: 1px solid #ddd !important; break-inside: avoid; }
  .print-header { display: block !important; }
  .btn-pri,.btn-acc,.btn-ghost,.btn-ghost-red,.btn-ghost-g { display: none !important; }
  a { color: inherit; text-decoration: none; }
}
.print-header { display: none; padding: 20px 0 14px; border-bottom: 2px solid var(--primary); margin-bottom: 20px; }
.print-header h1 { font-size: 20px; font-weight: 700; color: var(--primary); margin: 0; }
.print-header .ph-sub { font-size: 12px; color: #666; margin-top: 4px; }

/* Tabs */
.tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 20px; }
.tab-btn { padding: 8px 20px; cursor: pointer; font-size: 14px; font-weight: 600; color: #999; border-bottom: 2px solid transparent; margin-bottom: -2px; background: none; border-top: none; border-left: none; border-right: none; }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

/* Market search workflow box */
.workflow-box { background: #f8faff; border: 1px solid #dde3ee; border-radius: 10px; padding: 16px; }
.workflow-step { display: flex; gap: 10px; margin-bottom: 12px; align-items: flex-start; }
.workflow-step .step-num { width: 22px; height: 22px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
.workflow-step .step-body { flex: 1; font-size: 13px; }
.copy-box { background: #fff; border: 1px solid #dde3ee; border-radius: 8px; padding: 12px; font-size: 12px; color: #444; font-family: monospace; white-space: pre-wrap; word-break: break-all; margin: 6px 0; max-height: 160px; overflow-y: auto; }
textarea.paste-area { width: 100%; min-height: 100px; border: 1px solid #dde3ee; border-radius: 8px; padding: 10px; font-size: 12px; font-family: monospace; resize: vertical; outline: none; }
textarea.paste-area:focus { border-color: var(--primary-light); }

/* Map view */
#map-container { border-radius: 10px; overflow: hidden; }
.leaflet-popup-content-wrapper { font-family: 'Microsoft JhengHei','Noto Sans TC',sans-serif !important; border-radius: 10px !important; }
.leaflet-popup-content { margin: 14px 16px !important; }

/* Lease countdown */
.lease-alert-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(220px,1fr)); gap: 10px; margin-bottom: 20px; }
.lease-alert-card { background: #fff; border-radius: 10px; padding: 14px 16px; box-shadow: 0 1px 6px rgba(0,0,0,.07); border-left: 4px solid; }
.lac-urgent { border-left-color: var(--red); }
.lac-soon { border-left-color: var(--yellow); }
.lac-expired { border-left-color: #bbb; }

/* Maintenance log */
.maint-row { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 7px; font-size: 12px; border: 1px solid #eef0f6; background: #fafcff; margin-bottom: 4px; }
.maint-cat { padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; white-space: nowrap; }
.mc-repair { background: #fef3e2; color: #d4850a; }
.mc-insurance { background: #dce9fb; color: #1b3a6e; }
.mc-tax { background: #f3e5f5; color: #7c3aed; }
.mc-other { background: #eee; color: #555; }

/* Maintenance photo grid */
.maint-photo-grid { display:flex;flex-wrap:wrap;gap:6px;margin-top:6px; }
.maint-thumb { width:60px;height:60px;border-radius:7px;object-fit:cover;cursor:pointer;border:2px solid #eee;transition:border-color .15s,transform .15s; }
.maint-thumb:hover { border-color:var(--primary);transform:scale(1.06); }
.maint-notes { font-size:11px;color:#666;font-style:italic;padding:3px 0 0;line-height:1.45;width:100%; }
.maint-photo-add { display:inline-flex;align-items:center;justify-content:center;width:60px;height:60px;border-radius:7px;border:2px dashed #ccc;cursor:pointer;font-size:22px;color:#aaa;background:#fafafa;transition:border-color .15s,color .15s; }
.maint-photo-add:hover { border-color:var(--primary);color:var(--primary); }
.maint-photo-wrap { position:relative;display:inline-block; }
.maint-photo-del { position:absolute;top:-5px;right:-5px;width:17px;height:17px;background:#c0392b;color:#fff;border:none;border-radius:50%;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1; }
/* Photo lightbox */
.photo-lb { position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:zoom-out; }
.photo-lb img { max-width:92vw;max-height:90vh;border-radius:8px;object-fit:contain;cursor:default; }
.photo-lb-close { position:absolute;top:18px;right:24px;color:#fff;font-size:30px;cursor:pointer;background:none;border:none;line-height:1; }

/* Cashflow view */
.cf-prop-row { display: grid; grid-template-columns: 2fr repeat(6,1fr); gap: 0; font-size: 12px; }
.cf-cell { padding: 8px 10px; border-bottom: 1px solid #f0f0f0; }
.cf-hdr { background: #f6f8fb; font-weight: 600; font-size: 11px; color: #555; }
</style>
</head>

const _AC_APP_ID   = '1:102869565664:web:954030c95f1b9561d09085';
const _AC_SITE_KEY = '6Ld3P6YtAAAAAOWEvRzRAdcWJlMuxuIIsaYcECMb';
const _AC_BASE     = `https://firebaseappcheck.googleapis.com/v1/projects/${_FB_PROJECT}/apps/${_AC_APP_ID}`;
let _acToken = null, _acTokenExpiry = 0;

async function _acGetToken() {
  if (_acToken && Date.now() < _acTokenExpiry) return _acToken;
  try {
    const rcToken = await new Promise((res, rej) => {
      if (typeof grecaptcha === 'undefined') { rej(new Error('reCAPTCHA not loaded')); return; }
      grecaptcha.ready(() => grecaptcha.execute(_AC_SITE_KEY, { action: 'firebase' }).then(res).catch(rej));
    });
    const r = await fetch(`${_AC_BASE}:exchangeReCaptchaV3Token`, {

      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ recaptchaV3Token: rcToken }),
    });
    if (!r.ok) throw new Error('App Check ' + r.status);
    const d = await r.json();
    _acToken = d.token;
    const ttl = parseInt((d.ttl || '3600s').replace('s', '')) || 3600;
    _acTokenExpiry = Date.now() + (ttl - 60) * 1000;

  } catch(e) { console.warn('App Check token failed:', e.message); return null; }
}

// Build headers with both Firebase Auth token and App Check token
async function _fbHeaders(extra = {}) {
  const [authToken, acToken] = await Promise.all([_faToken(), _acGetToken()]);
  return {
    ...extra,
    ...(authToken ? { Authorization: 'Bearer ' + authToken } : {}),
    ...(acToken   ? { 'X-Firebase-AppCheck': acToken }       : {}),
  };
}

// Firebase Storage: upload base64 → returns metadata JSON
async function fsStorageUpload(path, base64data, mimeType) {
  const bin = atob(base64data);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const blob = new Blob([arr], { type: mimeType || 'application/octet-stream' });
  const headers = await _fbHeaders({ 'Content-Type': mimeType || 'application/octet-stream' });
  const r = await fetch(`${_FS_BASE}?uploadType=media&name=${encodeURIComponent(path)}`, {
    method: 'POST', headers, body: blob,
  });
  if (!r.ok) throw new Error('Storage upload ' + r.status);
  return r.json();
}
// Firebase Storage: download → returns base64 string (no prefix)
// token: optional downloadToken from upload metadata (bypasses CORS restrictions)
async function fsStorageDownload(path, token) {
  let url = `${_FS_BASE}/${encodeURIComponent(path)}?alt=media`;
  if (token) url += '&token=' + encodeURIComponent(token);
  const headers = token ? {} : await _fbHeaders(); // use auth headers only when no downloadToken
  let r;
  try { r = await fetch(url, token ? {} : { headers }); }
  catch(e) { throw new Error('failed to fetch: ' + e.message); }
  if (!r.ok) {
    let errBody = '';
    try { const j = await r.json(); errBody = j.error?.message || ''; } catch(_) {}
    throw new Error(`HTTP ${r.status}${errBody ? ' – ' + errBody : ''}`);
  }
  const blob = await r.blob();
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload  = e => res(e.target.result.split(',')[1]);
    reader.onerror = rej;
    reader.readAsDataURL(blob);
  });
}
// Firebase Storage: delete (fire-and-forget OK)
async function fsStorageDelete(path) {
  try {
    const headers = await _fbHeaders();
    await fetch(`${_FS_BASE}/${encodeURIComponent(path)}`, { method: 'DELETE', headers });
  } catch(e) {}
}

// ============================================================
// FIREBASE AUTH (REST API — no SDK needed)
// ============================================================
const _FA_BASE    = 'https://identitytoolkit.googleapis.com/v1';
const _FA_REFRESH = 'https://securetoken.googleapis.com/v1/token';
let _fbIdToken = null, _fbTokenExpiry = 0, _fbRefreshToken = null, _fbUid = null;

function _faEmail(uname) {
  // base64url encode to avoid collisions with non-ASCII usernames (e.g. Chinese)
  try {
    const b64 = btoa(unescape(encodeURIComponent(uname)))
      .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
    return b64 + '@rentalapp.cc';
  } catch(e) {
    return uname.replace(/[^a-zA-Z0-9]/g,'_') + '@rentalapp.cc';
  }
}
// Returns the Firestore path for the current user — uid-based when available
function _fbUserPath() { return _fbUid ? `users/${_fbUid}` : `users/${state.profile.username}`; }

async function _faSignIn(uname, pwd) {
  const r = await fetch(`${_FA_BASE}/accounts:signInWithPassword?key=${_FB_KEY}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: _faEmail(uname), password: pwd, returnSecureToken: true }),
  });
  if (!r.ok) { const e = await r.json(); throw new Error(e.error?.message || 'signin failed'); }
  return r.json();
}

async function _faSignUp(uname, pwd) {
  const r = await fetch(`${_FA_BASE}/accounts:signUp?key=${_FB_KEY}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: _faEmail(uname), password: pwd, returnSecureToken: true }),
  });
  if (!r.ok) { const e = await r.json(); throw new Error(e.error?.message || 'signup failed'); }
  return r.json();
}

function _faSetSession(data) {
  _fbIdToken      = data.idToken;
  _fbTokenExpiry  = Date.now() + (parseInt(data.expiresIn || 3600) - 60) * 1000;
  _fbRefreshToken = data.refreshToken;
  _fbUid          = data.localId || _fbUid;
  localStorage.setItem('rentalFbRefresh', _fbRefreshToken);
  if (_fbUid) localStorage.setItem('rentalFbUid', _fbUid);
}

async function _faDoRefresh() {
  const refresh = _fbRefreshToken || localStorage.getItem('rentalFbRefresh');
  if (!refresh) return null;
  try {
    const r = await fetch(`${_FA_REFRESH}?key=${_FB_KEY}`, {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(refresh)}`,
    });
    if (!r.ok) return null;
    const d = await r.json();
    _fbIdToken      = d.id_token;
    _fbTokenExpiry  = Date.now() + (parseInt(d.expires_in || 3600) - 60) * 1000;
    _fbRefreshToken = d.refresh_token;
    if (d.user_id) { _fbUid = d.user_id; localStorage.setItem('rentalFbUid', _fbUid); }
    localStorage.setItem('rentalFbRefresh', _fbRefreshToken);
    return _fbIdToken;
  } catch(e) { return null; }
}

async function _faToken() {
  if (_fbIdToken && Date.now() < _fbTokenExpiry) return _fbIdToken;
  return _faDoRefresh();
}

// Sign in (or create) Firebase Auth account after local auth succeeds — background, non-blocking
async function _faAuth(uname, pwd) {
  try { _faSetSession(await _faSignIn(uname, pwd)); }
  catch(e) {
    try { _faSetSession(await _faSignUp(uname, pwd)); }
    catch(e2) { console.warn('Firebase Auth:', e2.message); }
  }
}

async function _faRestoreSession() {
  _fbUid = localStorage.getItem('rentalFbUid') || null;
  await _faDoRefresh();
}

// One-time migration: copy Firestore data from users/{username} → users/{uid}
async function _migrateToUid(uname) {
  if (!_fbUid) return;
  const uidDoc = await fbGet(`users/${_fbUid}`);
  if (_fbR(uidDoc, 'userData')) return; // already at uid path, nothing to do
  const oldDoc = await fbGet(`users/${uname}`);
  if (!oldDoc) return;
  const patch = {};
  const ud = _fbR(oldDoc, 'userData'); if (ud) patch.userData = _fbS(ud);
  const ph = _fbR(oldDoc, 'pwdHash');  if (ph) patch.pwdHash  = _fbS(ph);
  if (Object.keys(patch).length) {
    await fbPatch(`users/${_fbUid}`, patch);
    showToast('🔒 資料已遷移至安全路徑', 3000);
  }
}

function _faSignOut() {
  _fbIdToken = null; _fbTokenExpiry = 0; _fbRefreshToken = null; _fbUid = null;
  localStorage.removeItem('rentalFbRefresh');
  localStorage.removeItem('rentalFbUid');
}

async function fbGet(docPath) {
  try {
    const headers = await _fbHeaders();
    const r = await fetch(`${_FB_BASE}/${docPath}?key=${_FB_KEY}`, { headers });
    if (r.status === 404) return null;
    return r.ok ? await r.json() : null;
  } catch(e) { return null; }
}

async function fbPatch(docPath, fields) {
  try {
    const headers = await _fbHeaders({ 'Content-Type': 'application/json' });
    const mask = Object.keys(fields).map(f => `updateMask.fieldPaths=${encodeURIComponent(f)}`).join('&');
    const r = await fetch(`${_FB_BASE}/${docPath}?${mask}&key=${_FB_KEY}`, {
      method: 'PATCH', headers, body: JSON.stringify({ fields })
    });
    return r.ok;
  } catch(e) { return false; }
}

const _fbS = v => ({ stringValue: String(v) });
const _fbR = (doc, f) => doc?.fields?.[f]?.stringValue ?? null;

async function fbDelete(docPath) {
  try {
    const headers = await _fbHeaders();
    const r = await fetch(`${_FB_BASE}/${docPath}?key=${_FB_KEY}`, { method: 'DELETE', headers });
    return r.ok;
  } catch(e) { return false; }
}

async function fbListUsers() {
  try {
    const r = await fetch(`${_FB_BASE}/users?key=${_FB_KEY}`);
    if (!r.ok) return [];
    const json = await r.json();
    const docs = json.documents || [];
    return docs.map(doc => {
      const parts = doc.name.split('/');
      const username = parts[parts.length - 1];
      const pwdHash  = _fbR(doc, 'pwdHash') || '';
      const rawData  = _fbR(doc, 'userData') || '';
      let propCount = '—', savedAt = '—';
      if (rawData) {
        try {
          const d = JSON.parse(rawData);
          if (d.properties) propCount = d.properties.length;
          if (d.savedAt) savedAt = new Date(d.savedAt).toLocaleString('zh-TW');
        } catch(e) {}
      }
      return { username, propCount, savedAt, hasPwd: !!pwdHash };
    });
  } catch(e) { return null; }
}

// ============================================================
// CONSTANTS & CALCULATIONS
// ============================================================
const NHI_RATE = 0.0211;
const NHI_THRESHOLD = 20000;
const RENTAL_STD_DEDUCT = 0.43;
const WITHHOLDING_RATE = 0.10; // 租賃所得10%扣繳（公司承租個人房東）
const TAX_BRACKETS = [
  {upper:590000,rate:.05,ded:0},{upper:1330000,rate:.12,ded:41300},
  {upper:2660000,rate:.20,ded:147700},{upper:4980000,rate:.30,ded:413700},
  {upper:Infinity,rate:.40,ded:911700},
];

function calcTax(income) {
  if (income <= 0) return 0;
  for (const b of TAX_BRACKETS) if (income <= b.upper) return Math.round(income * b.rate - b.ded);
  return Math.round(income * .40 - 911700);
}
function getMargRate(income) {
  if (income <= 0) return .05;
  for (const b of TAX_BRACKETS) if (income <= b.upper) return b.rate;
  return .40;
}
// effectiveRent: returns tier rent for today, or p.rent as fallback
function effectiveRent(p) {
  if (!p.rentTiers || !p.rentTiers.length) return p.rent || 0;
  const today = new Date().toISOString().slice(0,10);
  const tier = p.rentTiers.find(t => t.from && t.from <= today && (!t.to || today <= t.to));
  return tier ? (tier.rent || 0) : (p.rent || 0);
}
const propMonthly = p => effectiveRent(p) + (p.parking === 'separate' ? (p.parkingFee||0) : 0);
const propAnnual = p => propMonthly(p) * 12;
function propNHI(p) {
  // nhiEnabled: true=force on, false=force off, undefined=auto (original logic)
  if (p.nhiEnabled === false) return 0;
  const m = propMonthly(p);
  const rate = (p.nhiRate != null && p.nhiRate > 0) ? p.nhiRate / 100 : NHI_RATE;
  if (p.nhiEnabled === true) return m >= NHI_THRESHOLD ? m * rate : 0;
  return (p.tenantType==='company' && m >= NHI_THRESHOLD) ? m * rate : 0;
}
// 10%扣繳：公司承租個人房東時，公司代扣10%所得稅（年度申報時可抵繳）
function propWithholding(p) {
  // withholdingEnabled: true=force on, false=force off, undefined=auto
  if (p.withholdingEnabled === false) return 0;
  if (p.withholdingEnabled === true) return propMonthly(p) * WITHHOLDING_RATE;
  return p.tenantType==='company' ? propMonthly(p) * WITHHOLDING_RATE : 0;
}
// 每月實際入帳（公司承租：扣補充保費＋10%代扣後）
const propNetMonthly = p => propMonthly(p) - propNHI(p) - propWithholding(p);
function propTaxable(p, method) {
  const a = propAnnual(p);
  if (method==='standard') return a*(1-RENTAL_STD_DEDUCT);
  const e=(p.propertyTax||0)+(p.landTax||0)+(p.loanInterest||0)+(p.insurance||0)+(p.repair||0)+(p.depreciation||0)+(p.manageFee||0)*12;
  return Math.max(0, a-e);
}
const propYield = p => (!p.purchasePrice||p.purchasePrice<=0) ? null : propAnnual(p)/p.purchasePrice;
const propExpenses = p => (p.propertyTax||0)+(p.landTax||0)+(p.loanInterest||0)+(p.insurance||0)+(p.repair||0)+(p.depreciation||0)+(p.manageFee||0)*12;

function fullTaxCalc() {
  const s = state.taxSettings;
  const rentalTaxable = state.properties.reduce((sum,p)=>sum+propTaxable(p,s.rentalDeductMethod),0);
  const salaryTaxable = Math.max(0,(s.salaryIncome||0)-Math.min(s.salaryIncome||0,s.salarySpecialDed||218000));
  const grossTaxable = rentalTaxable+salaryTaxable+(s.otherIncome||0);
  const exemptions = (s.personalExemption||97000)*(1+(s.dependents||0));
  const stdDed = s.filingStatus==='married'?(s.standardDeduction||131000)*2:(s.standardDeduction||131000);
  const totalDed = exemptions+stdDed+Math.min(s.savingsDeduction||0,270000)+(s.otherSpecialDed||0);
  const netTaxable = Math.max(0, grossTaxable-totalDed);
  const grossTax = calcTax(netTaxable);
  // 10%扣繳抵稅：公司租戶代扣，年度申報時抵繳
  const withholdingCredit = state.properties.reduce((sum,p)=>sum+propWithholding(p)*12, 0);
  const payableTax = Math.max(0, grossTax-(s.preTaxPaid||0)-withholdingCredit);
  const refundable = Math.max(0, (s.preTaxPaid||0)+withholdingCredit-grossTax);
  const taxWithoutRental = calcTax(Math.max(0,salaryTaxable+(s.otherIncome||0)-totalDed));
  const rentalTaxImpact = Math.max(0, grossTax-taxWithoutRental);
  return { rentalTaxable, salaryTaxable, grossTaxable, totalDed, netTaxable, grossTax,
    payableTax, refundable, withholdingCredit, rentalTaxImpact,
    margRate: getMargRate(netTaxable), effRate: netTaxable>0?grossTax/netTaxable:0,
    totalAnnualRent: state.properties.reduce((s,p)=>s+propAnnual(p),0) };
}

// 共有人節稅試算
function coOwnerTaxCalc(p, method) {
  if (!p.coOwners||!p.coOwners.length) return null;
  const totalShare = p.coOwners.reduce((s,o)=>s+(+o.share||0), 0);
  if (Math.abs(totalShare-100)>0.5) return null;
  const annual = propAnnual(p);
  const owners = p.coOwners.map(o=>{
    const share = (+o.share||0)/100;
    const rentIncome = annual*share;
    const taxable = method==='standard' ? rentIncome*(1-RENTAL_STD_DEDUCT) : rentIncome*(1-RENTAL_STD_DEDUCT); // use standard for estimate
    const rate = +o.estMargRate||0.05;
    const tax = Math.round(taxable*rate);
    return {...o, share:+o.share, rentIncome, taxable, tax, estMargRate:rate};
  });
  const totalOwnerTax = owners.reduce((s,o)=>s+o.tax, 0);
  const singleTaxable = annual*(1-RENTAL_STD_DEDUCT);
  const singleMargRate = getMargRate(singleTaxable);
  const singleTax = Math.round(singleTaxable*singleMargRate);
  const savings = singleTax - totalOwnerTax;
  return { owners, totalOwnerTax, singleTax, singleMargRate, savings };
}

// ============================================================
// FORMATTERS
// ============================================================
const fmt = (n, d=0) => (n===null||n===undefined)?'—':Math.round(n).toLocaleString('zh-TW');
const fmtPct = r => (r*100).toFixed(2)+'%';
const fmtDate = d => d?d.replace(/-/g,'/'):'—';
const uid = () => 'p'+Date.now()+Math.random().toString(36).slice(2,6);
const propConfig = p => { let s=''; if(p.rooms)s+=p.rooms+'房'; if(p.living)s+=p.living+'廳'; if(p.bath)s+=p.bath+'衛'; return s||'—'; };
const parkingLabel = p => {
  const no = p.parkingNo ? `（${p.parkingNo}）` : '';
  if (p.parking==='included') return `含車位${no}`;
  if (p.parking==='separate') return `車位${no}+${fmt(p.parkingFee)}/月`;
  return '無車位';
};
const tenantLabel = t => t==='company'?'公司行號':'個人';

function rentStatus(p) {
  if (!p.marketLow||!p.marketHigh) return null;
  const m=propMonthly(p), mid=(p.marketLow+p.marketHigh)/2, diff=m-mid, pct=diff/mid;
  if (pct>.05) return {label:'高於行情 '+fmtPct(pct),cls:'bdg-green'};
  if (pct<-.05) return {label:'低於行情 '+fmtPct(-pct),cls:'bdg-red'};
  return {label:'符合行情',cls:'bdg-blue'};
}

}
function openSidebar() {

}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-backdrop').classList.remove('show');

function renderView() {
  const el = document.getElementById('main-content');
  const pm = document.getElementById('print-meta');
  if (pm) pm.textContent = `戶主：${profileName()} ／ 列印日期：${new Date().toLocaleDateString('zh-TW')} ／ 共 ${state.properties.length} 個房產`;
  switch (state.view) {
    case 'dashboard': el.innerHTML = renderDashboard(); attachCharts(); break;
    case 'properties': el.innerHTML = renderProperties(); break;
    case 'tax': el.innerHTML = renderTax(); attachTaxCharts(); break;
    case 'market': el.innerHTML = renderMarket(); break;
    case 'map': el.innerHTML = renderMap(); break;
    case 'cashflow': el.innerHTML = renderCashflow(); setTimeout(attachCashflowCharts, 80); break;
    case 'calc': el.innerHTML = renderCalc(); break;
    case 'settings': el.innerHTML = renderSettings(); break;
  }
}

function renderLeaseCountdown() {
  if (!state.properties.length) return '';
  const today = new Date(); today.setHours(0,0,0,0);
  const alerts = state.properties
    .filter(p => p.leaseEnd)
    .map(p => {
      const end = new Date(p.leaseEnd); end.setHours(0,0,0,0);
      const days = Math.round((end - today) / 86400000);
      return {...p, daysLeft: days};
    })
    .filter(p => p.daysLeft <= 90)
    .sort((a,b) => a.daysLeft - b.daysLeft);
  if (!alerts.length) return '';
  return `
  <div style="margin-bottom:20px">
    <div style="font-size:15px;font-weight:700;color:var(--primary);margin-bottom:10px;display:flex;align-items:center;gap:8px">
      ⏰ 租約到期提醒
      <span style="font-size:11px;font-weight:400;color:#888">（90天內）</span>
    </div>
    <div class="lease-alert-grid">
      ${alerts.map(p=>{
        const cls = p.daysLeft<0?'lac-expired':p.daysLeft<=30?'lac-urgent':'lac-soon';
        const color = p.daysLeft<0?'#999':p.daysLeft<=30?'var(--red)':'var(--yellow)';
        const label = p.daysLeft<0?`已到期 ${Math.abs(p.daysLeft)} 天`:`${p.daysLeft} 天後到期`;
        return `<div class="lease-alert-card ${cls}" style="cursor:pointer" onclick="navigate('properties')">
          <div style="font-weight:700;font-size:13px;color:var(--primary)">${p.name}</div>
          <div style="font-size:11px;color:#888">${p.district} · $${fmt(propMonthly(p))}/月 · ${tenantLabel(p.tenantType)}</div>
          <div style="font-size:19px;font-weight:700;color:${color};margin:6px 0 2px">${label}</div>
          <div style="font-size:11px;color:#aaa">到期日：${fmtDate(p.leaseEnd)}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function renderMapEmbed(p, hasGKey) {

  const addrText = [p.address, p.district, p.city, '台灣'].filter(Boolean).join(', ');
  const addrQ = encodeURIComponent(addrText);

  let iframeSrc;
  if (_mapMode === 'street' && hasGKey) {
    const loc = (p.lat && p.lng) ? `location=${p.lat},${p.lng}` : `q=${addrQ}`;
    iframeSrc = `https://www.google.com/maps/embed/v1/streetview?key=${gKey}&${loc}&heading=0&pitch=0&fov=90`;
  } else if (hasGKey) {
    iframeSrc = `https://www.google.com/maps/embed/v1/place?key=${gKey}&q=${addrQ}&language=zh-TW`;
  } else {
    const mapQ = (p.lat && p.lng) ? `${p.lat},${p.lng}` : addrQ;
    iframeSrc = `https://maps.google.com/maps?q=${mapQ}&hl=zh-TW&output=embed`;
  }

  const gMapsUrl = (p.lat&&p.lng)
    ? `https://www.google.com/maps?q=${p.lat},${p.lng}`
    : `https://www.google.com/maps?q=${addrQ}`;
  const svUrl = (p.lat&&p.lng)
    ? `https://www.google.com/maps?q=&layer=c&cbll=${p.lat},${p.lng}`
    : `https://www.google.com/maps?q=${addrQ}&layer=c`;

  const modeBar = hasGKey ? `
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <button class="${_mapMode==='map'?'btn-pri':'btn-ghost'} btn-sm" onclick="switchMapMode('map')">🗺️ 一般地圖</button>
      <button class="${_mapMode==='street'?'btn-pri':'btn-ghost'} btn-sm" onclick="switchMapMode('street')">📷 Google 街景</button>
    </div>` : `
    <div class="ibox ibox-blue" style="font-size:12px;margin-bottom:10px">
      💡 前往「⚙️ 設定」→「Google Maps API Key」設定後，可直接嵌入街景。目前顯示一般地圖，可拖曳地圖內的黃色小人（Pegman）到街道查看街景，或點下方按鈕新分頁開啟。
    </div>`;

  return `
    <div class="card">
      <div class="card-body" style="padding:14px">
        ${modeBar}
        <div style="font-size:12px;color:#666;margin-bottom:8px;font-weight:600">📍 ${addrText}</div>
        <iframe src="${iframeSrc}" width="100%" height="490"
          style="border:0;border-radius:8px;display:block"
          allowfullscreen loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>

    <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">
      <a href="${gMapsUrl}" target="_blank" class="btn-ghost btn-sm">🔗 在 Google 地圖開啟</a>

    </div>`;
}

async function geocodeAll() {
  const btn = document.getElementById('geocode-btn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ 定位中…'; }
  const toGeo = state.properties.filter(p => !p.lat || !p.lng);
  if (!toGeo.length) { showToast('所有房產已定位，若要重設請先點「清除定位快取」'); if(btn){btn.disabled=false;btn.textContent='📍 重新定位';} return; }
  let ok=0, approx=0, fail=0, failNames=[], netErr=false;
  const geoFetch = async (q) => {
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&accept-language=zh-TW&countrycodes=tw`);
      if (!res.ok) { console.warn('[geocode] HTTP', res.status, q); return null; }
      const data = await res.json();
      await new Promise(r => setTimeout(r, 1100));
      console.log('[geocode]', q, '→', data.length ? data[0].display_name : '無結果');
      return Array.isArray(data) && data.length ? data[0] : null;
    } catch(e) {
      console.error('[geocode] 網路錯誤:', e.message, '查詢:', q);
      netErr = true;
      await new Promise(r => setTimeout(r, 1100));
      return null;
    }
  };
  for (const p of toGeo) {
    let hit = null;
    // 第1優先：空格分隔格式
    if (p.address) hit = await geoFetch(`${p.address} ${p.district} ${p.city} 台灣`);
    // 第2優先：逗號分隔格式
    if (!hit && p.address) hit = await geoFetch(`${p.address}, ${p.district}, ${p.city}, 台灣`);
    // 第3優先：Nominatim 結構化查詢
    if (!hit && p.address) {
      try {
        const params = new URLSearchParams({ street: p.address, city: p.city, county: p.district, country: '台灣', format: 'json', limit: '1', countrycodes: 'tw' });
        const res = await fetch(`https://nominatim.openstreetmap.org/search?${params}`);
        if (res.ok) { const data = await res.json(); if (Array.isArray(data) && data.length) hit = data[0]; }
        console.log('[geocode structured]', p.address, '→', hit ? hit.display_name : '無結果');
        await new Promise(r => setTimeout(r, 1100));
      } catch(e) { netErr = true; await new Promise(r => setTimeout(r, 1100)); }
    }
    // 第4優先：僅行政區（大致定位）
    if (!hit) hit = await geoFetch(`${p.district} ${p.city} 台灣`);
    if (hit) {
      p.lat = parseFloat(hit.lat);
      p.lng = parseFloat(hit.lon);
      const isApprox = !p.address || ['suburb','neighbourhood','quarter','administrative'].includes(hit.addresstype) || hit.class === 'boundary' || hit.type === 'administrative';
      if (isApprox) approx++; else ok++;
    } else {
      fail++;
      failNames.push(p.name);
    }
  }
  if (netErr && !ok && !approx) {
    showToast('❌ 定位失敗：無法連線到 Nominatim，請確認網路或改用 F12 → Console 查看錯誤', 6000);
    if (btn) { btn.disabled=false; btn.textContent='📍 定位所有房產'; }
    return;
  }
  saveUserData();
  // 更新副標題計數
  const countEl = document.getElementById('map-loc-count');
  if (countEl) countEl.textContent = state.properties.filter(p=>p.lat&&p.lng).length;
  let msg = `✅ 定位完成：${ok} 個精確`;
  if (approx) msg += `，${approx} 個以行政區標示`;
  if (fail) msg += `，${fail} 個失敗（${failNames.join('、')}）`;
  showToast(msg, fail ? 5000 : 3000);
  if (btn) { btn.disabled=false; btn.textContent='📍 重新定位'; }
  initLeafletMap();
}

function clearGeoCache() {
  state.properties.forEach(p => { p.lat=null; p.lng=null; });
  saveUserData();
  showToast('✅ 定位快取已清除');
  initLeafletMap();
}

async function handleMaintPhotoUpload(input) {
  const files = Array.from(input.files);
  const MAX = 5;
  const remaining = MAX - _maintPhotos.length;
  if (remaining <= 0) { showToast('⚠️ 最多上傳 5 張照片'); input.value=''; return; }
  for (const file of files.slice(0, remaining)) {
    if (!file.type.startsWith('image/')) continue;
    const data = await _compressImg(file, 1400, 0.82);
    _maintPhotos.push({ id:'mp'+Date.now()+Math.random().toString(36).slice(2,5), name:file.name, type:file.type, data });
  }
  renderMaintPhotoGrid();
  input.value = '';
}

function _compressImg(file, maxW, quality) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const full = canvas.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', quality);
        resolve(full.split(',')[1]);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderMaintSection(p) {
  const allLogs = p.maintenanceLogs || [];
  const totalAmt = allLogs.reduce((s,l)=>s+(l.amount||0),0);
  const cnt = allLogs.length;
  const open = !!_sectionOpen[p.id+'_maint'];
  const showAll = !!_sectionOpen[p.id+'_maint_all'];
  const PAGE = 3;
  const logs = showAll ? allLogs : allLogs.slice(0, PAGE);
  const summary = cnt ? `${cnt} 筆 · 累計 $${fmt(totalAmt)}` : '尚無記錄';

  const logRows = logs.map(l => {
    const photoCount = (l.photos||[]).length;
    const photoThumbs = (l.photos||[]).map(ph =>
      `<img class="maint-thumb" src="data:${ph.type};base64,${ph.data}"
        onclick="viewMaintPhotoById('${p.id}','${l.id}','${ph.id}')"
        title="${(ph.name||'').replace(/"/g,'&quot;')}">`
    ).join('');
    return `
      <div class="maint-row" style="flex-wrap:wrap;align-items:flex-start">
        <div style="display:flex;align-items:center;gap:8px;width:100%;flex-wrap:wrap">
          <span class="maint-cat ${maintCatCls(l.category)}">${maintCatLabel(l.category)}</span>
          <span style="color:#888;flex-shrink:0;font-size:11px">${fmtDate(l.date)}</span>
          <span style="flex:1;color:#333;font-weight:500;min-width:80px">${l.desc}</span>
          ${l.amount?`<span style="font-weight:600;color:var(--red);flex-shrink:0">-$${fmt(l.amount)}</span>`:''}
          <button class="btn-ghost-red no-print" onclick="deleteMaintLog('${p.id}','${l.id}')" style="padding:2px 6px;font-size:10px;flex-shrink:0">✕</button>
        </div>
        ${l.notes?`<div class="maint-notes">${l.notes.replace(/</g,'&lt;')}</div>`:''}
        ${photoCount?`<div class="maint-photo-grid">${photoThumbs}</div>`:''}
      </div>`;
  }).join('');

  return `
  <div class="prop-sec-hdr no-print" onclick="togglePropSection('${p.id}','maint')">
    <div class="prop-sec-title">🔧 修繕記錄 · ${summary}</div>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="btn-ghost btn-sm no-print" type="button"
        onclick="event.stopPropagation();openMaintModal('${p.id}')"
        style="font-size:11px;padding:3px 10px">＋ 新增</button>
      <span id="sec-arr-${p.id}-maint" style="font-size:11px;color:#aaa;min-width:10px">${open?'▲':'▼'}</span>
    </div>
  </div>
  <div id="sec-${p.id}-maint" style="${open?'':'display:none'};padding-bottom:4px">
    ${!cnt?'<div style="font-size:11px;color:#bbb;padding:4px 0 6px">尚無記錄</div>':''}
    ${logRows}
    ${cnt>PAGE?`<button class="btn-ghost btn-sm no-print" style="width:100%;margin-top:4px;font-size:11px"
      onclick="toggleMaintAll('${p.id}')">${showAll?'▲ 收合':'▼ 查看全部 '+cnt+' 筆'}</button>`:''}
  </div>`;
}

function renderMarketMini(p) {
  const m=propMonthly(p), mn=Math.min(p.marketLow*.85,m*.85), mx=Math.max(p.marketHigh*1.15,m*1.15), r=mx-mn;
  const lo=((p.marketLow-mn)/r*100).toFixed(1), hi=((p.marketHigh-mn)/r*100).toFixed(1);
  const dot=((m-mn)/r*100).toFixed(1), above=m>(p.marketLow+p.marketHigh)/2;
  return `<div style="margin-top:10px;background:#f8faff;border-radius:8px;padding:10px">
    <div style="font-size:11px;color:#888;margin-bottom:5px">市場行情比較（月租）</div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:#aaa;margin-bottom:4px"><span>$${fmt(p.marketLow)}</span><span style="font-size:10px">市場區間</span><span>$${fmt(p.marketHigh)}</span></div>
    <div class="mbar-track"><div class="mbar-range" style="left:${lo}%;width:${hi-lo}%"></div><div class="mbar-dot" style="left:${dot}%;background:${above?'#1e8449':'#c0392b'}"></div></div>
    <div style="font-size:11px;color:#888;margin-top:4px">目前 <strong style="color:var(--primary)">$${fmt(m)}</strong> ${above?'高於':'低於'}市場中位 $${fmt((p.marketLow+p.marketHigh)/2)}</div>
  </div>`;
}

  const rows = hist.map((r, i) => {
    const dt = new Date(r.savedAt);
    const dtStr = dt.toLocaleString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    const isCurrent = r.marketLow===p.marketLow && r.marketHigh===p.marketHigh;
    return `<tr style="${isCurrent?'background:#f0fdf4':''}">
      <td style="font-size:11px;color:#888;white-space:nowrap">${dtStr}</td>
      <td style="font-size:12px;font-weight:600">$${fmt(r.marketLow)} — $${fmt(r.marketHigh)}</td>

      <td style="font-size:10px;color:#aaa">${(r.sources||[]).join(' · ').slice(0,40)||'-'}</td>
      <td>
        <div style="display:flex;gap:4px">
          ${!isCurrent?`<button class="btn-ghost btn-sm" onclick="restoreMarketRecord('${p.id}','${r.id}')" style="font-size:10px;padding:2px 7px" title="還原為此次行情">↩ 還原</button>`:'<span style="font-size:10px;color:#16a34a;padding:2px 7px">✔ 現行</span>'}
          <button class="btn-ghost-red btn-sm" onclick="deleteMarketRecord('${p.id}','${r.id}')" style="font-size:10px;padding:2px 7px">✕</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  const key = p.id + '_mktHist';
  const open = !!_sectionOpen[key];
  return `
  <div class="prop-sec-hdr no-print" onclick="togglePropSection('${p.id}','mktHist')" style="margin-top:12px">
    <div class="prop-sec-title">📅 市場搜尋記錄 · ${hist.length} 筆</div>

        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}


function renderRentScenarios(p) {
  const tc=fullTaxCalc(), mr=tc.margRate;
  const scenarios=[{label:'維持現況',rent:propMonthly(p)},{label:'調至市場中位',rent:Math.round((p.marketLow+p.marketHigh)/2/500)*500},{label:'調至市場高標',rent:Math.round(p.marketHigh/500)*500}];
  return `<table class="tbl" style="font-size:12px"><thead><tr><th>情境</th><th>月租</th><th>年淨估計</th><th>稅負影響</th></tr></thead><tbody>${scenarios.map(sc=>{
    const a=sc.rent*12, nhi=(p.tenantType==='company'&&sc.rent>=NHI_THRESHOLD)?sc.rent*NHI_RATE*12:0;
    const tax=a*(1-RENTAL_STD_DEDUCT)*mr, net=a-nhi-tax;
    const cur=sc.rent===propMonthly(p);
    return `<tr style="${cur?'background:#f0f7ff':''}"><td>${sc.label}${cur?' <span class="bdg bdg-blue" style="font-size:10px">現況</span>':''}</td><td style="font-weight:700">$${fmt(sc.rent)}</td><td style="color:var(--green);font-weight:600">$${fmt(net)}</td><td style="color:var(--yellow)">$${fmt(tax)}</td></tr>`;
  }).join('')}</tbody></table><div style="font-size:10px;color:#aaa;margin-top:4px">稅負以邊際稅率 ${fmtPct(mr)} 估算</div>`;
}

var _calcTenant = 'individual';

function calcSetTenant(t) {
  _calcTenant = t;
  var bi = document.getElementById('calc-type-individual');
  var bc = document.getElementById('calc-type-company');
  if (!bi || !bc) return;
  if (t === 'individual') {
    bi.style.background = 'var(--primary)'; bi.style.color = '#fff';
    bc.style.background = '#f0f3f8'; bc.style.color = '#888';
  } else {
    bc.style.background = 'var(--primary)'; bc.style.color = '#fff';
    bi.style.background = '#f0f3f8'; bi.style.color = '#888';
  }
  calcUpdate();
}

function calcUpdate() {
  var rentEl = document.getElementById('calc-rent');
  var parkEl = document.getElementById('calc-parking');
  if (!rentEl) return;
  var rentVal = parseFloat(rentEl.value) || 0;
  var parkVal = parkEl ? (parseFloat(parkEl.value) || 0) : 0;
  var total = rentVal + parkVal;
  var isCompany = _calcTenant === 'company';

  var nhi = (isCompany && total >= 20000) ? +(total * 0.0211).toFixed(0) : 0;
  var wh  = isCompany ? +(total * 0.10).toFixed(0) : 0;
  var net = total - nhi - wh;

  var rb = document.getElementById('calc-result-body');
  var ab = document.getElementById('calc-annual-body');
  if (!rb || !ab) return;

  if (total <= 0) {
    rb.innerHTML = '<div style="text-align:center;padding:30px 0;color:#bbb;font-size:13px">← 請輸入租金條件</div>';
    ab.innerHTML = '<div style="text-align:center;padding:20px 0;color:#bbb;font-size:13px">輸入後自動顯示</div>';
    return;
  }

  function fmtN(n) { return Math.round(n).toLocaleString('zh-TW'); }

  var rows = [
    { label: '月租金合計', sub: (rentVal > 0 && parkVal > 0) ? '租金 $'+fmtN(rentVal)+' + 車位費 $'+fmtN(parkVal) : '', val: total, cls: 'var(--primary)', bold: true },
  ];
  if (isCompany) {
    var nhiLabel = nhi > 0 ? '二代健保補充保費 (2.11%)' : '二代健保補充保費';
    var nhiSub   = nhi === 0 ? '月租未達 $20,000，本月免扣' : '';
    rows.push({ label: nhiLabel, sub: nhiSub, val: nhi, cls: nhi > 0 ? 'var(--accent)' : '#bbb', deduct: true });
    rows.push({ label: '租賃所得 10% 扣繳稅款', sub: '年度報稅時全額抵稅', val: wh, cls: '#7c3aed', deduct: true });
  }
  rows.push({ label: '月實際入帳', sub: isCompany ? '（扣除代扣款後實際到手）' : '（個人承租，無代扣項目）', val: net, cls: 'var(--green)', bold: true, isTotal: true });

  rb.innerHTML = '<div>' + rows.map(function(r, i) {
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:' +
      (r.isTotal ? '14px 0 2px' : '10px 0') + ';' +
      (i > 0 && !r.isTotal ? 'border-top:1px solid #f0f2f6;' : '') +
      (r.isTotal ? 'border-top:2px solid #e0e6ef;margin-top:4px;' : '') + '">' +
      '<div>' +
        '<div style="font-size:' + (r.bold ? '14' : '13') + 'px;font-weight:' + (r.bold ? '700' : '500') + ';color:#333">' +
          (r.deduct ? '<span style="color:#bbb;margin-right:4px">−</span>' : '') + r.label +
        '</div>' +
        (r.sub ? '<div style="font-size:11px;color:#999;margin-top:1px">' + r.sub + '</div>' : '') +
      '</div>' +
      '<div style="font-size:' + (r.bold ? '20' : '14') + 'px;font-weight:' + (r.bold ? '700' : '500') + ';color:' + r.cls + ';text-align:right;min-width:90px">' +
        (r.deduct ? '-$' + fmtN(r.val) : '$' + fmtN(r.val)) +
      '</div>' +
    '</div>';
  }).join('') + '</div>';

  var annualItems = [
    { label: '年租金合計', val: total * 12, cls: 'var(--primary)' },
    { label: '年實際入帳', val: net * 12, cls: 'var(--green)' },
  ];
  if (isCompany) {
    annualItems.push({ label: '年健保費代扣', val: nhi * 12, cls: 'var(--accent)' });
    annualItems.push({ label: '年所得稅代扣', val: wh * 12, cls: '#7c3aed' });
  }
  ab.innerHTML = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">' +
    annualItems.map(function(r) {
      return '<div style="background:#f8faff;border-radius:10px;padding:12px 14px">' +
        '<div style="font-size:11px;color:#777;margin-bottom:4px">' + r.label + '</div>' +
        '<div style="font-size:16px;font-weight:700;color:' + r.cls + '">$' + fmtN(r.val) + '</div>' +
      '</div>';
    }).join('') + '</div>';

  if (isCompany) {
    ab.innerHTML += '<div style="margin-top:12px;background:#f3f0ff;border-radius:8px;padding:10px 14px;font-size:12px;color:#5b21b6;line-height:1.6">' +
      '💡 <strong>年度報稅說明</strong>：$' + fmtN(wh * 12) + ' 扣繳稅款屬預繳性質，年度報稅時<strong>全額抵稅</strong>。' +
      '若實際綜所稅率低於 10%，差額可向稅捐機關申請<strong>退稅</strong>。' +
    '</div>';
  }
}

async function _tgPost(token, chatId, text) {
  const url = `https://api.telegram.org/bot${token}/sendMessage`;
  const res = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({chat_id: chatId, text, parse_mode: 'HTML'})
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.description || '發送失敗');
  return data;
}

function _tgCheck() {
  const t = state.telegram;
  if (!t.botToken || !t.chatId) {
    showToast('⚠️ 請先在「設定」頁填入 Bot Token 與 Chat ID');
    navigate('settings');
    return false;
  }
  return true;
}

async function sendTelegramTest() {
  if (!_tgCheck()) return;
  saveUserData(); // persist token/chatId before sending
  const btn = event.target;
  btn.disabled = true; btn.textContent = '發送中…';
  try {
    const now = new Date().toLocaleString('zh-TW');
    await _tgPost(state.telegram.botToken, state.telegram.chatId,
      `🏠 <b>房東租賃管理系統</b>\n✅ 連線測試成功！\n\n戶主：${profileName()}\n房產數量：${state.properties.length} 個\n測試時間：${now}`);
    showToast('✅ 測試訊息已送出，請查看 Telegram');
  } catch(e) {
    showToast('❌ 發送失敗：' + e.message + '（請確認 Token 與 Chat ID 正確）');
  }
  btn.disabled = false; btn.textContent = '📨 發送測試訊息';
}

async function sendTelegramAlert() {
  if (!_tgCheck()) return;
  saveUserData(); // persist token/chatId before sending
  const btn = document.getElementById('tg-btn');
  if (btn) { btn.disabled = true; btn.textContent = '發送中…'; }

  try {
    const days = state.telegram.alertDays || 90;
    const today = new Date(); today.setHours(0,0,0,0);

    const alerts = state.properties
      .filter(p => p.leaseEnd)
      .map(p => {
        const end = new Date(p.leaseEnd); end.setHours(0,0,0,0);
        return {...p, daysLeft: Math.round((end - today) / 86400000)};
      })
      .filter(p => p.daysLeft <= days)
      .sort((a,b) => a.daysLeft - b.daysLeft);

    const tc = fullTaxCalc();
    const totalM = state.properties.reduce((s,p)=>s+propMonthly(p),0);
    const totalNetM = state.properties.reduce((s,p)=>s+propNetMonthly(p),0);
    const now = new Date().toLocaleDateString('zh-TW');

    let msg = `🏠 <b>租賃管理提醒</b>  ${now}\n`;
    msg += `戶主：${profileName()} | 共 ${state.properties.length} 個房產\n`;
    msg += `月租合計：$${fmt(totalM)}（實收 $${fmt(totalNetM)}）\n`;
    msg += `\n`;

    if (alerts.length === 0) {
      msg += `✅ <b>${days} 天內無租約到期。</b>\n\n`;
    } else {
      msg += `⏰ <b>${days} 天內到期租約（${alerts.length} 筆）</b>\n`;
      msg += `${'─'.repeat(28)}\n`;
      alerts.forEach(p => {
        const icon = p.daysLeft < 0 ? '🔴' : p.daysLeft <= 30 ? '🟠' : '🟡';
        const label = p.daysLeft < 0
          ? `已到期 ${Math.abs(p.daysLeft)} 天`
          : `${p.daysLeft} 天後到期`;
        msg += `${icon} <b>${p.name}</b>\n`;
        msg += `   ${p.city} ${p.district} | $${fmt(propMonthly(p))}/月 | ${tenantLabel(p.tenantType)}\n`;
        msg += `   到期日：${fmtDate(p.leaseEnd)}  ⟶  <b>${label}</b>\n\n`;
      });
    }

    // All properties summary
    msg += `📋 <b>全部房產一覽</b>\n${'─'.repeat(28)}\n`;
    state.properties.forEach((p,i) => {
      const yd = propYield(p);
      const rs = rentStatus(p);
      msg += `${i+1}. <b>${p.name}</b>  $${fmt(propMonthly(p))}/月`;
      if (yd !== null) msg += `  收益${fmtPct(yd)}`;
      if (rs) msg += `  ${rs.label}`;
      msg += `\n`;
    });

    msg += `\n<i>此訊息由房東租賃管理系統 v4 產生</i>`;

    await _tgPost(state.telegram.botToken, state.telegram.chatId, msg);
    showToast(`✅ 通知已送出！${alerts.length ? `（${alerts.length} 筆到期提醒）` : '（無到期租約）'}`);
  } catch(e) {
    showToast('❌ 發送失敗：' + e.message);
  }

  if (btn) { btn.disabled = false; btn.textContent = '📱 Telegram 通知'; }
}

function gv(id, type='string') { const el=document.getElementById(id); if(!el)return type==='number'?0:''; return type==='number'?parseFloat(el.value)||0:el.value||''; }

function saveProperty() {
  // Validate co-owners
  if (_formCoOwners.length > 0) {
    const totalShare = _formCoOwners.reduce((s,o)=>s+(+o.share||0), 0);
    if (Math.abs(totalShare-100) > 0.1) { showToast('⚠️ 共有人持分合計須達100%，請調整後再儲存'); return; }
    if (_formCoOwners.some(o=>!o.name||!o.name.trim())) { showToast('⚠️ 請填入所有共有人姓名'); return; }
  }
  const data={
    name:gv('f-name')||'未命名房產', city:gv('f-city'), district:gv('f-district'), address:gv('f-address'),
    type:gv('f-type'), sizePin:gv('f-sizePin','number'), rooms:gv('f-rooms','number'), living:gv('f-living','number'),
    bath:gv('f-bath','number'), floor:gv('f-floor','number'), totalFloors:gv('f-totalFloors','number'),
    parking:gv('f-parking'), parkingFee:gv('f-parkingFee','number'), parkingNo:gv('f-parkingNo'),
    rent:gv('f-rent','number'), tenantType:gv('f-tenantType'),
    nhiEnabled: document.getElementById('f-nhiEnabled') ? document.getElementById('f-nhiEnabled').checked : undefined,
    nhiRate: document.getElementById('f-nhiRate') ? (parseFloat(document.getElementById('f-nhiRate').value) || 2.11) : 2.11,
    withholdingEnabled: document.getElementById('f-withholdingEnabled') ? document.getElementById('f-withholdingEnabled').checked : undefined,
    leaseStart:gv('f-leaseStart'), leaseEnd:gv('f-leaseEnd'),
    purchasePrice:gv('f-purchasePrice','number'), mortgageMonthly:gv('f-mortgageMonthly','number'),
    manageFee:gv('f-manageFee','number'), propertyTax:gv('f-propertyTax','number'),
    landTax:gv('f-landTax','number'), loanInterest:gv('f-loanInterest','number'),
    insurance:gv('f-insurance','number'), repair:gv('f-repair','number'), depreciation:gv('f-depreciation','number'),
    marketLow:gv('f-marketLow','number'), marketHigh:gv('f-marketHigh','number'),
    notes:gv('f-notes'),
    marketAnalysis:document.getElementById('f-marketAnalysis')?document.getElementById('f-marketAnalysis').value:'',
    coOwners: JSON.parse(JSON.stringify(_formCoOwners)),
    rentTiers: JSON.parse(JSON.stringify(_editingTiers)),
  };
  if (state.editingId) {
    const idx=state.properties.findIndex(p=>p.id===state.editingId);
    if(idx>=0){
      const old = state.properties[idx];
      // Preserve non-form fields
      data.maintenanceLogs = old.maintenanceLogs || [];
      data.leaseFiles   = old.leaseFiles   || [];
      data.leaseDrafts  = old.leaseDrafts  || [];
      // rentTiers already in data from _editingTiers — no need to restore from old
      data.rentHistory = old.rentHistory || [];
      // Reset geocode cache if address changed
      if (old.address!==data.address || old.city!==data.city || old.district!==data.district) {
        data.lat = null; data.lng = null;
      } else {
        data.lat = old.lat; data.lng = old.lng;
      }
      state.properties[idx]={...old,...data};
    }
  } else {
    state.properties.push({id:uid(), maintenanceLogs:[], leaseFiles:[], leaseDrafts:[], rentTiers:[], rentHistory:[], lat:null, lng:null, ...data});
  }
  closePropertyModal(true); renderView(); saveUserData(); showToast('✅ 已儲存');
}

function applyMarketJSON(propId) {
  const raw = document.getElementById('json-paste').value.trim();
  if (!raw) { showToast('⚠️ 請先貼入 Claude 回傳的 JSON'); return; }
  try {
    const data = JSON.parse(raw);
    const idx = state.properties.findIndex(p=>p.id===propId);
    if (idx<0) { showToast('❌ 找不到房產'); return; }
    const p = state.properties[idx];
    if (data.marketLow)      p.marketLow      = data.marketLow;
    if (data.marketHigh)     p.marketHigh     = data.marketHigh;
    if (data.marketAnalysis) p.marketAnalysis = data.marketAnalysis;
    // ── record history ──
    if (!p.marketHistory) p.marketHistory = [];
    p.marketHistory.unshift({
      id: 'mh' + Date.now(),
      savedAt: new Date().toISOString(),
      marketLow:      data.marketLow      || p.marketLow,
      marketHigh:     data.marketHigh     || p.marketHigh,
      marketAnalysis: data.marketAnalysis || p.marketAnalysis || '',
      sources: data.sources || [],
    });
    closeMarketModal(); renderView(); saveUserData(); showToast('✅ 市場行情已更新並記錄');
  } catch(e) { showToast('❌ JSON 格式錯誤，請重新貼上'); }
}

function applyMarketJSONAll() {
  const raw = document.getElementById('json-paste').value.trim();
  if (!raw) { showToast('⚠️ 請先貼入 Claude 回傳的 JSON'); return; }
  let list;
  try {
    const data = JSON.parse(raw);
    list = Array.isArray(data) ? data : (data.properties || data.results || [data]);
  } catch(e) { showToast('❌ JSON 格式錯誤，請重新貼上'); return; }
  let updated = 0, skipped = 0;
  list.forEach(data => {
    const p = state.properties.find(x => x.id === data.propertyId);
    if (!p) { skipped++; return; }
    if (data.marketLow)      p.marketLow      = data.marketLow;
    if (data.marketHigh)     p.marketHigh     = data.marketHigh;
    if (data.marketAnalysis) p.marketAnalysis = data.marketAnalysis;

async function callClaudeAPI(prompt) {
  const key = localStorage.getItem('rentalAnthropicKey');
  if (!key) throw new Error('未設定 Anthropic API Key，請至「設定」頁面填入');
  const model = localStorage.getItem('rentalAnthropicModel') || 'claude-haiku-4-5-20251001';
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'content-type': 'application/json',
      'anthropic-dangerous-allow-any-cross-origin-source': 'true'
    },
    body: JSON.stringify({
      model,
      max_tokens: 8192,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error?.message || `API 錯誤 (${resp.status})`);
  return data.content[0].text;
}

function deleteMarketRecord(propId, recId) {
  const p = state.properties.find(x=>x.id===propId);
  if (!p||!p.marketHistory) return;
  p.marketHistory = p.marketHistory.filter(r=>r.id!==recId);
  saveUserData(); renderView();
}

function restoreMarketRecord(propId, recId) {
  const p = state.properties.find(x=>x.id===propId);
  if (!p||!p.marketHistory) return;
  const rec = p.marketHistory.find(r=>r.id===recId);
  if (!rec) return;
  p.marketLow      = rec.marketLow;
  p.marketHigh     = rec.marketHigh;
  p.marketAnalysis = rec.marketAnalysis;
  saveUserData(); renderView(); showToast('✅ 已還原為 '+new Date(rec.savedAt).toLocaleString('zh-TW'));
}

function importJSON(input) {
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const uname = state.profile.username;
      if (!uname) { showToast('❌ 請先登入再匯入'); return; }
      const data = JSON.parse(e.target.result);
      if (data.properties)  state.properties = data.properties;
      if (data.taxSettings) Object.assign(state.taxSettings, data.taxSettings);
      if (data.telegram)    Object.assign(state.telegram, data.telegram);
      // 不覆蓋 state.profile，避免 saveUserData() 存到錯誤的帳號 key
      renderView();
      // Full JSON (including base64 binary) is saved to IndexedDB — no size limit
      saveUserData();
      const mb = (new Blob([e.target.result]).size / 1024 / 1024).toFixed(1);
      showToast(`✅ 已匯入資料（${mb} MB），儲存至瀏覽器 IndexedDB`);
    } catch(err) { showToast('❌ 檔案格式錯誤，請選擇正確的 JSON 檔'); }
  };
  reader.readAsText(file);
  input.value = '';
}

async function exportXLS() {
  if (typeof ExcelJS === 'undefined') {
    showToast('❌ ExcelJS 尚未載入，請重新整理頁面後再試'); return;
  }
  showToast('⏳ 正在產製 Excel 報表，請稍候...');
  await new Promise(r => setTimeout(r, 60));

  const wb = new ExcelJS.Workbook();
  wb.creator = profileName() || '房東管理系統';
  wb.created = new Date();

  const today = new Date().toLocaleDateString('zh-TW');
  const tc = fullTaxCalc();

  // ── Palette ─────────────────────────────────────
  const C = {
    navy:       'FF1B3A6E', navyL:    'FF2D5A9E',
    accent:     'FFE07B2A', green:    'FF1E8449',
    red:        'FFC0392B', purple:   'FF5B21B6',
    white:      'FFFFFFFF', altRow:   'FFF6F8FB',
    lightBlue:  'FFE4EEF9', lightGreen:'FFD5F0E3',
    lightYellow:'FFFEF3E2', lightRed: 'FFFDE8E6',
    border:     'FFD0D8E8', text:     'FF222222',
    textL:      'FF777777',
  };
  const F = 'Microsoft JhengHei';
  const FMT_TWD  = '"$"#,##0';
  const FMT_PCT  = '0.00%';

  // ── Style builder ───────────────────────────────
  function mkStyle(o) {
    // o: bold, size, italic, color, bg, align, wrap, numFmt, borderStyle, borderColor, noFill
    const s = {
      font: { name: F, bold: !!o.bold, italic: !!o.italic,
              size: o.size || 10, color: { argb: o.color || C.text } },
      fill: o.noFill ? { type: 'none' } :
            { type: 'pattern', pattern: 'solid', fgColor: { argb: o.bg || C.white } },
      alignment: { horizontal: o.align || 'left', vertical: 'middle', wrapText: !!o.wrap },
    };
    if (o.numFmt) s.numFmt = o.numFmt;
    const bs = o.borderStyle || 'hair';
    const bc = { argb: o.borderColor || C.border };
    if (o.borderStyle !== false) {
      s.border = { top:{style:bs,color:bc}, bottom:{style:bs,color:bc},
                   left:{style:bs,color:bc}, right:{style:bs,color:bc} };
    }
    return s;
  }

  // Pre-built style presets (called as functions so each call returns a new obj)
  const STYLE = {
    title:   () => mkStyle({ bold:true, size:15, color:C.white, bg:C.navy, align:'center', borderStyle:false }),
    subTitle:() => mkStyle({ size:10,   color:C.white, bg:C.navyL, align:'center', borderStyle:false }),
    secHdr:  () => mkStyle({ bold:true, size:11, color:C.navy,  bg:C.lightBlue, borderStyle:'medium', borderColor:C.navyL }),
    colHdr:  (bg) => mkStyle({ bold:true, size:9,  color:C.white, bg:bg||C.navyL, align:'center', wrap:true, borderStyle:'thin', borderColor:C.navy }),
    data:    (alt,align,color,numFmt) => mkStyle({ size:10, color:color||C.text, bg:alt?C.altRow:C.white, align:align||'left', numFmt }),
    dataBold:(alt,align,color,numFmt) => mkStyle({ bold:true, size:10, color:color||C.text, bg:alt?C.altRow:C.white, align:align||'left', numFmt }),
    total:   (bg,color,align) => mkStyle({ bold:true, size:10, color:color||C.navy, bg:bg||C.lightBlue, align:align||'right', borderStyle:'thin', borderColor:C.navyL }),
    note:    () => mkStyle({ italic:true, size:9, color:C.textL, noFill:true, borderStyle:false }),
  };

  // ── Helpers ─────────────────────────────────────
  function sc(cell, val, style, numFmt) {
    cell.value = val;
    if (style) cell.style = style;
    if (numFmt) cell.numFmt = numFmt;
    return cell;
  }

  function addTitleRows(ws, title, sub, cols) {
    ws.addRow([]); // top padding
    const r1 = ws.addRow([title]);
    ws.mergeCells(r1.number, 1, r1.number, cols); r1.height = 38;
    r1.getCell(1).style = STYLE.title();
    const r2 = ws.addRow([sub]);
    ws.mergeCells(r2.number, 1, r2.number, cols); r2.height = 22;
    r2.getCell(1).style = STYLE.subTitle();
    ws.addRow([]); // gap
  }

  function addSecHdr(ws, text, cols) {
    const r = ws.addRow([text]);
    ws.mergeCells(r.number, 1, r.number, cols); r.height = 24;
    r.getCell(1).style = STYLE.secHdr(); return r;
  }

  function addColHdr(ws, labels, rowH, bg) {
    const r = ws.addRow(labels); r.height = rowH || 26;
    for (let c = 1; c <= labels.length; c++) r.getCell(c).style = STYLE.colHdr(bg);
    return r;
  }

  function freezeAt(ws, row) {
    ws.views = [{ state:'frozen', xSplit:0, ySplit:row, showGridLines:false }];
  }

  // ==================================================
  // SHEET 1 — 📊 總覽
  // ==================================================
  (() => {
    const ws = wb.addWorksheet('📊 總覽');
    const COLS = 8;
    [16, 20, 14, 20, 14, 20, 14, 14].forEach((w, i) => ws.getColumn(i+1).width = w);
    ws.views = [{ showGridLines: false }];

    addTitleRows(ws, '🏠 房東租賃管理報表',
      `戶主：${profileName()}　　報告日期：${today}　　共 ${state.properties.length} 個房產`, COLS);

    // KPI Section
    addSecHdr(ws, '■ 收益總覽', COLS);

    const totalM    = state.properties.reduce((s,p)=>s+propMonthly(p),0);
    const totalNetM = state.properties.reduce((s,p)=>s+propNetMonthly(p),0);
    const nhiYTot   = state.properties.reduce((s,p)=>s+propNHI(p),0)*12;
    const whYTot    = state.properties.reduce((s,p)=>s+propWithholding(p),0)*12;
    const ydProps   = state.properties.filter(p=>propYield(p)!==null);
    const avgYd     = ydProps.length ? ydProps.reduce((s,p)=>s+propYield(p),0)/ydProps.length : null;

    // KPI header
    const kpiHdr = ws.addRow(['指標','數值（月）','指標','數值（月）','','','','']);
    ws.mergeCells(kpiHdr.number,5,kpiHdr.number,COLS);
    kpiHdr.height = 20;
    [1,2,3,4].forEach(c => kpiHdr.getCell(c).style = STYLE.colHdr());
    kpiHdr.getCell(5).style = STYLE.colHdr();

    const kpiRows = [
      ['月租金合計（帳面）', totalM,       '月實際入帳合計', totalNetM],
      ['年租金合計（帳面）', totalM*12,    '年實際入帳合計', totalNetM*12],
      ['年二代健保費代扣',   nhiYTot,      '年10%所得稅代扣', whYTot],
      ['租賃所得（標準扣除）',tc.rentalTaxable,'租賃稅負影響', tc.rentalTaxImpact],
      ['年度應繳綜所稅',     tc.grossTax,  avgYd!==null?'平均租金報酬率':'年度預估退稅', avgYd!==null?avgYd:tc.refundable],
    ];
    kpiRows.forEach(([l1,v1,l2,v2], ri) => {
      const alt = ri%2===1;
      const r = ws.addRow([l1, v1, l2, v2, '', '', '', '']);
      ws.mergeCells(r.number, 5, r.number, COLS);
      r.height = 22;

  // ── Download ─────────────────────────────────────

    const buf=await wb.xlsx.writeBuffer();

    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=`房東租賃報表_${state.profile.username||'data'}_${new Date().toISOString().slice(0,10)}.xlsx`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    showToast('✅ Excel 報表已匯出！（5張工作表，含格式化樣式）');
  } catch(err) {
    showToast('❌ 匯出失敗：'+err.message);
    console.error('exportXLS error:', err);
  }
